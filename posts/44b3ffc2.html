/">C语言</a></li><li class="nav-item"><a href="/tags/PLC/">PLC</a></li><li class="nav-item"><a href="/tags/STM32/">STM32</a></li><li class="nav-item"><a href="/archives/">归档</a></li><li class="nav-item nav-item-search"><a href="javascript:void(0);" onclick="window.showPureSearch&&window.showPureSearch()" title="搜索" class="search-trigger"><svg class="search-icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></a></li></ul></nav></div></header><main class="main"><div class="main-inner"><div class="content-wrap"><div class="content"><article class="post-detail" itemscope itemtype="http://schema.org/Article"><header class="post-header"><h1 class="post-title" itemprop="name headline">分支和循环之do...while循环</h1><div class="post-meta"><span class="post-time">发表于 <time itemprop="datePublished" datetime="2024-10-09T15:10:00+08:00">2024-10-09</time></span></div></header><div class="post-body" itemprop="articleBody"><p>语法：</p><figure class="highlight c"><table><tr><td class="gutter"><pre><span class="line">1</span><span class="line">2</span><span class="line">3</span></pre></td><td class="code"><pre><span class="line"><span class="keyword">do</span> &#123;</span><span class="line">    循环语句;</span><span class="line">&#125; <span class="keyword">while</span> (表达式);</span></pre></td></tr></table></figure><p>do语句的特点：循环至少执行一次，使用场景有限。</p><span id="more"></span><h3 id="使用do…while打印1-10的数字"><a href="#使用do…while打印1-10的数字" class="headerlink" title="使用do…while打印1-10的数字"></a>使用do…while打印1-10的数字</h3><figure class="highlight c"><table><tr><td class="gutter"><pre><span class="line">1</span><span class="line">2</span><span class="line">3</span><span class="line">4</span><span class="line">5</span><span class="line">6</span><span class="line">7</span><span class="line">8</span><span class="line">9</span><span class="line">10</span></pre></td><td class="code"><pre><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;stdio.h&gt;</span></span></span><span class="line"><span class="comment">//打印1-10的数字</span></span><span class="line"><span class="type">int</span> <span class="title function_">main</span><span class="params">()</span> &#123;</span><span class="line">    <span class="type">int</span> i = <span class="number">1</span>;</span><span class="line">    <span class="keyword">do</span> &#123;</span><span class="line">        <span class="built_in">printf</span>(<span class="string">&quot;%d &quot;</span>,i);</span><span class="line">        i++;</span><span class="line">    &#125; <span class="keyword">while</span> (i&lt;=<span class="number">10</span>);</span><span class="line">    <span class="keyword">return</span> <span class="number">0</span>;</span><span class="line">&#125;</span></pre></td></tr></table></figure><h3 id="break"><a href="#break" class="headerlink" title="break"></a>break</h3><figure class="highlight c"><table><tr><td class="gutter"><pre><span class="line">1</span><span class="line">2</span><span class="line">3</span><span class="line">4</span><span class="line">5</span><span class="line">6</span><span class="line">7</span><span class="line">8</span><span class="line">9</span><span class="line">10</span><span class="line">11</span><span class="line">12</span></pre></td><td class="code"><pre><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;stdio.h&gt;</span></span></span><span class="line"><span class="type">int</span> <span class="title function_">main</span><span class="params">()</span> &#123;</span><span class="line">    <span class="type">int</span> i = <span class="number">1</span>;</span><span class="line">    <span class="keyword">do</span> &#123;</span><span class="line">        <span class="keyword">if</span> (i == <span class="number">5</span>) &#123;</span><span class="line">            <span class="keyword">break</span>;<span class="comment">//当1==5的时候就终止循环了</span></span><span class="line">        &#125;</span><span class="line">        <span class="built_in">printf</span>(<span class="string">&quot;%d &quot;</span>,i);<span class="comment">//打印的结果是1 2 3 4</span></span><span class="line">        i++;</span><span class="line">    &#125; <span class="keyword">while</span> (i&lt;=<span class="number">10</span>);</span><span class="line">    <span class="keyword">return</span> <span class="number">0</span>;</span><span class="line">&#125;</span></pre></td></tr></table></figure><h3 id="continue"><a href="#continue" class="headerlink" title="continue"></a>continue</h3><figure class="highlight c"><table><tr><td class="gutter"><pre><span class="line">1</span><span class="line">2</span><span class="line">3</span><span class="line">4</span><span class="line">5</span><span class="line">6</span><span class="line">7</span><span class="line">8</span><span class="line">9</span><span class="line">10</span><span class="line">11</span><span class="line">12</span></pre></td><td class="code"><pre><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;stdio.h&gt;</span></span></span><span class="line"><span class="type">int</span> <span class="title function_">main</span><span class="params">()</span> &#123;</span><span class="line">	<span class="type">int</span> i = <span class="number">1</span>;</span><span class="line">    <span class="keyword">do</span> &#123;</span><span class="line">        <span class="keyword">if</span> (i == <span class="number">5</span>) &#123;</span><span class="line">            <span class="keyword">continue</span>;</span><span class="line">        &#125;</span><span class="line">        <span class="built_in">printf</span>(<span class="string">&quot;%d &quot;</span>,i);<span class="comment">//打印的结果是1 2 3 4后死循环</span></span><span class="line">        i++;</span><span class="line">    &#125; <span class="keyword">while</span> (i&lt;=<span class="number">10</span>);</span><span class="line">    <span class="keyword">return</span> <span class="number">0</span>;</span><span class="line">&#125;</span></pre></td></tr></table></figure></div><div class="post-tags"><a href="/tags/C/" class="post-tag"># C</a></div><nav class="post-nav"><a href="/posts/6e4091aa.html" class="post-nav-prev" title="分支和循环练习-计算n的阶乘">&larr; 分支和循环练习-计算n的阶乘 </a><a href="/posts/144e24ab.html" class="post-nav-next" title="分支和循环之for循环">分支和循环之for循环 &rarr;</a></nav></article></div></div></div></main><footer class="site-footer"><div class="footer-inner"><div class="footer-line"></div><div class="copyright">&copy; 2022 - 2026 <span>Zmyu&#39;s Blog</span></div></div></footer><div id="search-overlay" class="search-overlay"><div class="search-popup"><div class="search-header"><span class="search-icon">&#128269;</span> <input type="text" id="search-input" class="search-input" placeholder="输入关键字搜索..." autocomplete="off" autofocus> <span id="search-close" class="search-close">&times;</span></div><div id="search-results" class="search-results"></div></div></div><script src="/js/search.js?v=1.0.2"></script><script src="/js/main.js?v=1.0.2"></script><script src="/js/outdate.js"></script></body></html>
