iv class="header-inner"><div class="site-brand"><a href="/" class="site-title">Zmyu&#39;s Blog</a></div><nav class="site-nav"><ul class="nav-menu"><li class="nav-item"><a href="/">首页</a></li><li class="nav-item"><a href="/about/">关于</a></li><li class="nav-item"><a href="/tags/C/">C语言</a></li><li class="nav-item"><a href="/tags/PLC/">PLC</a></li><li class="nav-item"><a href="/tags/STM32/">STM32</a></li><li class="nav-item"><a href="/archives/">归档</a></li><li class="nav-item nav-item-search"><a href="javascript:void(0);" onclick="window.showPureSearch&&window.showPureSearch()" title="搜索" class="search-trigger"><svg class="search-icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></a></li></ul></nav></div></header><main class="main"><div class="main-inner"><div class="content-wrap"><div class="content"><article class="post-detail" itemscope itemtype="http://schema.org/Article"><header class="post-header"><h1 class="post-title" itemprop="name headline">输入的数组中最大元素与首元素交换，最小的与末元素交换，并输出</h1><div class="post-meta"><span class="post-time">发表于 <time itemprop="datePublished" datetime="2024-11-03T20:15:00+08:00">2024-11-03</time></span></div></header><div class="post-body" itemprop="articleBody"><p>题目：输入数组，最大的与第一个元素交换，最小的与最后一个元素交换，输出数组。</p><figure class="highlight c"><table><tr><td class="gutter"><pre><span class="line">1</span><span class="line">2</span><span class="line">3</span><span class="line">4</span><span class="line">5</span><span class="line">6</span><span class="line">7</span><span class="line">8</span><span class="line">9</span><span class="line">10</span><span class="line">11</span><span class="line">12</span><span class="line">13</span><span class="line">14</span><span class="line">15</span><span class="line">16</span><span class="line">17</span><span class="line">18</span><span class="line">19</span><span class="line">20</span><span class="line">21</span><span class="line">22</span><span class="line">23</span><span class="line">24</span><span class="line">25</span><span class="line">26</span><span class="line">27</span><span class="line">28</span><span class="line">29</span><span class="line">30</span><span class="line">31</span><span class="line">32</span><span class="line">33</span><span class="line">34</span><span class="line">35</span><span class="line">36</span><span class="line">37</span><span class="line">38</span><span class="line">39</span><span class="line">40</span><span class="line">41</span><span class="line">42</span><span class="line">43</span><span class="line">44</span><span class="line">45</span><span class="line">46</span><span class="line">47</span><span class="line">48</span><span class="line">49</span><span class="line">50</span><span class="line">51</span></pre></td><td class="code"><pre><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;stdio.h&gt;</span></span></span><span class="line"><span class="type">void</span> <span class="title function_">Exchange_Biggest</span><span class="params">(<span class="type">int</span>* input)</span></span><span class="line">&#123;</span><span class="line">    <span class="type">int</span> Biggest = input[<span class="number">0</span>];</span><span class="line">    <span class="type">int</span> i;</span><span class="line">    <span class="type">int</span> temp;</span><span class="line">    <span class="type">int</span> record_Biggest = <span class="number">0</span>;</span><span class="line">    <span class="keyword">for</span> (i=<span class="number">0</span>; i&lt;<span class="number">10</span>; i++)</span><span class="line">    &#123;</span><span class="line">        <span class="keyword">if</span>(input[i]&gt;Biggest)<span class="comment">//遍历数组，如果比记录到最大的还大，就把Biggest的值换成更大的。</span></span><span class="line">        &#123;</span><span class="line">            Biggest = input[i];</span><span class="line">            record_Biggest = i;</span><span class="line">        &#125;</span><span class="line">    &#125;</span><span class="line">    temp = input[<span class="number">0</span>];<span class="comment">//把第一个值和最大的交换一下</span></span><span class="line">    input[<span class="number">0</span>] = input[record_Biggest];</span><span class="line">    input[record_Biggest] = temp;</span><span class="line">&#125;</span><span class="line"><span class="type">void</span> <span class="title function_">Exchange_Smallest</span><span class="params">(<span class="type">int</span>* input)</span></span><span class="line">&#123;</span><span class="line">    <span class="type">int</span> Smallest = input[<span class="number">0</span>];</span><span class="line">    <span class="type">int</span> i;</span><span class="line">    <span class="type">int</span> temp;</span><span class="line">    <span class="type">int</span> record_Smallest = <span class="number">0</span>;</span><span class="line">    <span class="keyword">for</span> (i=<span class="number">0</span>; i&lt;<span class="number">10</span>; i++)</span><span class="line">    &#123;</span><span class="line">        <span class="keyword">if</span>(input[i]&lt;Smallest)</span><span class="line">        &#123;</span><span class="line">            Smallest = input[i];</span><span class="line">            record_Smallest = i;</span><span class="line">        &#125;</span><span class="line">    &#125;</span><span class="line">    temp = input[<span class="number">9</span>];</span><span class="line">    input[<span class="number">9</span>] = input[record_Smallest];</span><span class="line">    input[record_Smallest] = temp;</span><span class="line">&#125;</span><span class="line"><span class="type">int</span> <span class="title function_">main</span><span class="params">()</span> &#123;</span><span class="line">    <span class="type">int</span> input[<span class="number">10</span>];</span><span class="line">    <span class="type">int</span> i;</span><span class="line">    <span class="keyword">for</span> (i=<span class="number">0</span>; i&lt;<span class="number">10</span>; i++)<span class="comment">//输入数组</span></span><span class="line">    &#123;</span><span class="line">        <span class="built_in">scanf</span>(<span class="string">&quot;%d&quot;</span>,&amp;input[i]);</span><span class="line">    &#125;</span><span class="line">    Exchange_Biggest(input);<span class="comment">//交换最大的数</span></span><span class="line">    Exchange_Smallest(input);<span class="comment">//交换最小的数</span></span><span class="line">    <span class="keyword">for</span> (i=<span class="number">0</span>; i&lt;<span class="number">10</span>; i++) &#123;</span><span class="line">        <span class="built_in">printf</span>(<span class="string">&quot;%d &quot;</span>,input[i]);</span><span class="line">    &#125;</span><span class="line">    <span class="keyword">return</span> <span class="number">0</span>;</span><span class="line">&#125;</span></pre></td></tr></table></figure></div><div class="post-tags"><a href="/tags/C/" class="post-tag"># C</a></div><nav class="post-nav"><a href="/posts/93d24db8.html" class="post-nav-prev" title="字符串左旋和字符串右旋">&larr; 字符串左旋和字符串右旋 </a><a href="/posts/38902a79.html" class="post-nav-next" title="将一个数组逆序输出">将一个数组逆序输出 &rarr;</a></nav></article></div></div></div></main><footer class="site-footer"><div class="footer-inner"><div class="footer-line"></div><div class="copyright">&copy; 2022 - 2026 <span>Zmyu&#39;s Blog</span></div></div></footer><div id="search-overlay" class="search-overlay"><div class="search-popup"><div class="search-header"><span class="search-icon">&#128269;</span> <input type="text" id="search-input" class="search-input" placeholder="输入关键字搜索..." autocomplete="off" autofocus> <span id="search-close" class="search-close">&times;</span></div><div id="search-results" class="search-results"></div></div
