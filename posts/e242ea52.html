<span class="line">18</span></pre></td><td class="code"><pre><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;stdio.h&gt;</span></span></span><span class="line"><span class="type">int</span> <span class="title function_">Cal_Peach</span><span class="params">(<span class="type">int</span> day,<span class="type">int</span> Left_Peach)</span></span><span class="line">&#123;</span><span class="line">    <span class="keyword">if</span> (day==<span class="number">1</span>) &#123;</span><span class="line">        <span class="keyword">return</span> (Left_Peach + <span class="number">1</span>) * <span class="number">2</span>;</span><span class="line">    &#125; <span class="keyword">else</span> &#123;</span><span class="line">        <span class="type">int</span> temp = (Left_Peach+<span class="number">1</span>)*<span class="number">2</span>;</span><span class="line">        <span class="keyword">return</span> Cal_Peach(--day, temp);</span><span class="line">    &#125;</span><span class="line">&#125;</span><span class="line"><span class="type">int</span> <span class="title function_">main</span><span class="params">()</span></span><span class="line">&#123;</span><span class="line">    <span class="type">int</span> day = <span class="number">9</span>;</span><span class="line">    <span class="type">int</span> Left_Peach = <span class="number">1</span>;</span><span class="line">    <span class="type">int</span> Peach = Cal_Peach(day,Left_Peach);</span><span class="line">    <span class="built_in">printf</span>(<span class="string">&quot;%d\n&quot;</span>,Peach);</span><span class="line">    <span class="keyword">return</span> <span class="number">0</span>;</span><span class="line">&#125;</span></pre></td></tr></table></figure><p>for循环解决：</p><figure class="highlight c"><table><tr><td class="gutter"><pre><span class="line">1</span><span class="line">2</span><span class="line">3</span><span class="line">4</span><span class="line">5</span><span class="line">6</span><span class="line">7</span><span class="line">8</span><span class="line">9</span><span class="line">10</span><span class="line">11</span><span class="line">12</span><span class="line">13</span><span class="line">14</span></pre></td><td class="code"><pre><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;stdio.h&gt;</span></span></span><span class="line"><span class="type">int</span> <span class="title function_">main</span><span class="params">()</span></span><span class="line">&#123;</span><span class="line">    <span class="type">int</span> day;</span><span class="line">    <span class="type">int</span> x = <span class="number">1</span>;</span><span class="line">    <span class="type">int</span> y = <span class="number">0</span>;</span><span class="line">    <span class="keyword">for</span> (day=<span class="number">9</span>; day&gt;=<span class="number">1</span>; day--)</span><span class="line">    &#123;</span><span class="line">        y = ( x + <span class="number">1</span> ) * <span class="number">2</span>;</span><span class="line">        x = y;</span><span class="line">    &#125;</span><span class="line">    <span class="built_in">printf</span>(<span class="string">&quot;%d\n&quot;</span>,y);</span><span class="line">    <span class="keyword">return</span> <span class="number">0</span>;</span><span class="line">&#125;</span></pre></td></tr></table></figure></div><div class="post-tags"><a href="/tags/C/" class="post-tag"># C</a></div><nav class="post-nav"><a href="/posts/67b370a.html" class="post-nav-prev" title="打印菱形图案">&larr; 打印菱形图案 </a><a href="/posts/64f58741.html" class="post-nav-next" title="弹跳球问题">弹跳球问题 &rarr;</a></nav></article></div></div></div></main><footer class="site-footer"><div class="footer-inner"><div class="footer-line"></div><div class="copyright">&copy; 2022 - 2026 <span>Zmyu&#39;s Blog</span></div></div></footer><div id="search-overlay" class="search-
