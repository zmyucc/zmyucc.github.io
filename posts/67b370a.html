an><span class="line">2</span><span class="line">3</span><span class="line">4</span><span class="line">5</span><span class="line">6</span><span class="line">7</span><span class="line">8</span><span class="line">9</span><span class="line">10</span><span class="line">11</span><span class="line">12</span><span class="line">13</span><span class="line">14</span><span class="line">15</span><span class="line">16</span><span class="line">17</span><span class="line">18</span><span class="line">19</span><span class="line">20</span><span class="line">21</span><span class="line">22</span><span class="line">23</span><span class="line">24</span><span class="line">25</span><span class="line">26</span><span class="line">27</span><span class="line">28</span><span class="line">29</span><span class="line">30</span><span class="line">31</span><span class="line">32</span><span class="line">33</span><span class="line">34</span><span class="line">35</span><span class="line">36</span><span class="line">37</span><span class="line">38</span><span class="line">39</span></pre></td><td class="code"><pre><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;stdio.h&gt;</span></span></span><span class="line"><span class="meta">#<span class="keyword">define</span> MAX 4 <span class="comment">//定义要打印的行数</span></span></span><span class="line"><span class="type">int</span> <span class="title function_">main</span><span class="params">()</span></span><span class="line">&#123;</span><span class="line">    <span class="type">int</span> row = <span class="number">1</span>;<span class="comment">//行</span></span><span class="line">    <span class="keyword">for</span> (row=<span class="number">1</span>; row&lt;=MAX; row++)<span class="comment">//打印上半部分</span></span><span class="line">    &#123;</span><span class="line">        <span class="type">int</span> col = <span class="number">2</span>*row<span class="number">-1</span>;<span class="comment">//上半部分每行打印的星号个数</span></span><span class="line">        <span class="type">int</span> spcae = MAX - row;<span class="comment">//上半部分的空格数是定义的最大行数-现在行数</span></span><span class="line">        <span class="type">int</span> i;<span class="comment">//打印空格</span></span><span class="line">        <span class="type">int</span> j;<span class="comment">//打印*号</span></span><span class="line">        <span class="keyword">for</span> (i=<span class="number">0</span>; i&lt;spcae; i++)<span class="comment">//打印空格</span></span><span class="line">        &#123;</span><span class="line">            <span class="built_in">printf</span>(<span class="string">&quot; &quot;</span>);</span><span class="line">        &#125;</span><span class="line">        <span class="keyword">for</span> (j=<span class="number">0</span>; j&lt;col; j++)<span class="comment">//打印星号</span></span><span class="line">        &#123;</span><span class="line">            <span class="built_in">printf</span>(<span class="string">&quot;*&quot;</span>);</span><span class="line">        &#125;</span><span class="line">        <span class="built_in">printf</span>(<span class="string">&quot;\n&quot;</span>);</span><span class="line">    &#125;</span><span class="line">    <span class="keyword">for</span> (row=<span class="number">1</span>; row&lt;MAX; row++)<span class="comment">//打印下半部分</span></span><span class="line">    &#123;</span><span class="line">        <span class="type">int</span> col = <span class="number">2</span>*MAX-(<span class="number">2</span>*row+<span class="number">1</span>);<span class="comment">//下半部分每行打印的星号个数</span></span><span class="line">        <span class="type">int</span> spcae = row;<span class="comment">//下半部分的空格数和行数是相等的</span></span><span class="line">        <span class="type">int</span> i;<span class="comment">//打印空格</span></span><span class="line">        <span class="type">int</span> j;<span class="comment">//打印*号</span></span><span class="line">        <span class="keyword">for</span> (i=<span class="number">0</span>; i&lt;spcae; i++)<span class="comment">//打印空格</span></span><span class="line">        &#123;</span><span class="line">            <span class="built_in">printf</span>(<span class="string">&quot; &quot;</span>);</span><span class="line">        &#125;</span><span class="line">        <span class="keyword">for</span> (j=<span class="number">0</span>; j&lt;col; j++)<span class="comment">//打印星号</span></span><span class="line">        &#123;</span><span class="line">            <span class="built_in">printf</span>(<span class="string">&quot;*&quot;</span>);</span><span class="line">        &#125;</span><span class="line">        <span class="built_in">printf</span>(<span class="string">&quot;\n&quot;</span>);</span><span class="line">    &#125;</span><span class="line">    <span class="keyword">return</span> <span class="number">0</span>;</span><span class="line">&#125;</span></pre></td></tr></table></figure></div><div class="post-tags"><a href="/tags/C/" class="post-tag"># C</a></div><nav class="post-nav"><a href="/posts/57d6473f.html" class="post-nav-prev" title="求分数序列和">&larr; 求分数序列和 </a><a href="/posts/e242ea52.html" class="post-nav-next" title="猴子吃桃问题">猴子吃桃问题 &rarr;</a></nav></article></div></div></div></main><footer class="site-footer"><div class="footer-inner"><div class="footer-line"></div><div class="copyright">&copy; 2022 - 2026 <span>Zmyu&#39;s Blog</span></div></div></footer><div id="search-overlay" class="search-overlay"><div class="search-popup"><div class="search-header"><span class="search-icon">&#128269;</span> <input type="text" id="search-input" class="search-input" placeholder="输入关键字搜索..." autocomplete="off" autofocus> <span id="search-close" class="search-close">&times;</span></div><div id="search-results" class="search-results"></div></div></div><script src="/js/search.js?v=1.0.2"></script><script src="/js/main.js?v=1.0.2"></script><script src="/js/outdate.js"></script></body></html>
