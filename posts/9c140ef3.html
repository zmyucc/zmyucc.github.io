an><span class="line">18</span></pre></td><td class="code"><pre><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;stdio.h&gt;</span></span></span><span class="line"><span class="type">int</span> <span class="title function_">main</span><span class="params">()</span> &#123;</span><span class="line">    <span class="type">int</span> num = <span class="number">0</span>;</span><span class="line">    <span class="type">int</span> a = <span class="number">0</span>;</span><span class="line">    <span class="type">int</span> b = <span class="number">0</span>;</span><span class="line">    <span class="keyword">while</span> (<span class="number">1</span>) &#123;</span><span class="line">        num++;</span><span class="line">        <span class="keyword">for</span> (a=<span class="number">0</span>; a&lt;num+<span class="number">100</span>; a++) &#123;</span><span class="line">            <span class="keyword">for</span> (b=<span class="number">0</span>; b&lt;num+<span class="number">168</span>; b++) &#123;</span><span class="line">                <span class="keyword">if</span> ((num+<span class="number">100</span> == a*a)&amp;&amp;(num+<span class="number">168</span> == b*b)) &#123;</span><span class="line">                    <span class="built_in">printf</span>(<span class="string">&quot;%d,%d,%d&quot;</span>,a,b,num);</span><span class="line">                    <span class="keyword">break</span>;</span><span class="line">                &#125;</span><span class="line">            &#125;</span><span class="line">        &#125;</span><span class="line">    &#125;</span><span class="line">    <span class="keyword">return</span> <span class="number">0</span>;</span><span class="line">&#125;</span></pre></td></tr></table></figure></div><div class="post-tags"><a href="/tags/C/" class="post-tag"># C</a></div><nav class="post-nav"><a href="/posts/6803d08.html" class="post-nav-prev" title="求输入的日期是一年中的第几天">&larr; 求输入的日期是一年中的第几天 <
