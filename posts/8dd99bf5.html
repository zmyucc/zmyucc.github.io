n class="line">26</span><span class="line">27</span><span class="line">28</span><span class="line">29</span><span class="line">30</span><span class="line">31</span><span class="line">32</span><span class="line">33</span><span class="line">34</span><span class="line">35</span><span class="line">36</span><span class="line">37</span><span class="line">38</span><span class="line">39</span><span class="line">40</span><span class="line">41</span></pre></td><td class="code"><pre><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;stdio.h&gt;</span></span></span><span class="line"><span class="type">void</span> <span class="title function_">init</span><span class="params">(<span class="type">int</span> arr[],<span class="type">int</span> sz)</span></span><span class="line">&#123;</span><span class="line">    <span class="type">int</span> i = <span class="number">0</span>;</span><span class="line">    <span class="keyword">for</span> (i=<span class="number">0</span>; i&lt;sz; i++) &#123;</span><span class="line">        arr[i] = <span class="number">0</span>;</span><span class="line">        <span class="built_in">printf</span>(<span class="string">&quot;%d &quot;</span>,arr[i]);</span><span class="line">    &#125;</span><span class="line">&#125;</span><span class="line">&nbsp;</span><span class="line"><span class="type">void</span> <span class="title function_">print</span><span class="params">(<span class="type">int</span> arr[],<span class="type">int</span> sz)</span></span><span class="line">&#123;</span><span class="line">    <span class="type">int</span> i;</span><span class="line">    <span class="keyword">for</span> (i = <span class="number">0</span>; i&lt;sz; i++) &#123;</span><span class="line">        <span class="built_in">printf</span>(<span class="string">&quot;%d &quot;</span>,arr[i]);</span><span class="line">    &#125;</span><span class="line">&#125;</span><span class="line">&nbsp;</span><span class="line"><span class="type">void</span> <span class="title function_">reverse</span><span class="params">(<span class="type">int</span> arr[],<span class="type">int</span> sz)</span></span><span class="line">&#123;</span><span class="line">    <span class="type">int</span> i,x,y;</span><span class="line">    x = sz<span class="number">-1</span>;</span><span class="line">    <span class="type">int</span> temp[sz];</span><span class="line">    <span class="keyword">for</span> (i = <span class="number">0</span>; i&lt;sz; i++) &#123;</span><span class="line">        temp[i] = arr[x];</span><span class="line">        x--;</span><span class="line">    &#125;</span><span class="line">    <span class="keyword">for</span> (y=<span class="number">0</span>; y&lt;sz; y++) &#123;</span><span class="line">        arr[y] = temp[y];</span><span class="line">    &#125;</span><span class="line">    print(temp,sz);</span><span class="line">&#125;</span><span class="line">&nbsp;</span><span class="line"><span class="type">int</span> <span class="title function_">main</span><span class="params">()</span> &#123;</span><span class="line">    <span class="type">int</span> arr[] = &#123;<span class="number">1</span>,<span class="number">2</span>,<span class="number">3</span>,<span class="number">4</span>,<span class="number">5</span>,<span class="number">6</span>,<span class="number">7</span>,<span class="number">8</span>,<span class="number">9</span>,<span class="number">10</span>&#125;;</span><span class="line">    <span class="type">int</span> sz = <span class="keyword">sizeof</span>(arr)/<span class="keyword">sizeof</span>(arr[<span class="number">0</span>]);</span><span class="line"><span class="comment">//    init(arr,sz);</span></span><span class="line"><span class="comment">//    print(arr,sz);</span></span><span class="line">    reverse(arr,sz);</span><span class="line">    <span class="keyword">return</span> <span class="number">0</span>;</span><span class="line">&#125;</span></pre></td></tr></table></figure><hr><p>交换数组：将数组A的内容和数组B的内容进行交换（数组一样大）。</p><figure class="highlight c"><table><tr><td class="gutter"><pre><span class="line">1</span><span class="line">2</span><span class="line">3</span><span class="line">4</span><span class="line">5</span><span class="line">6</span><span class="line">7</span><span class="line">8</span><span class="line">9</span><span class="line">10</span><span class="line">11</span><span class="line">12</span><span class="line">13</span><span class="line">14</span><span class="line">15</span><span class="line">16</span><span class="line">17</span><span class="line">18</span><span class="line">19</span><span class="line">20</span><span class="line">21</span><span class="line">22</span><span class="line">23</span><span class="line">24</span><span class="line">25</span></pre></td><td class="code"><pre><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;stdio.h&gt;</span></span></span><span class="line"><span class="type">int</span> <span class="title function_">main</span><span class="params">()</span></span><span class="line">&#123;</span><span class="line">    <span class="type">int</span> A[<span class="number">10</span>] = &#123;<span class="number">1</span>,<span class="number">2</span>,<span class="number">3</span>,<span class="number">4</span>,<span class="number">5</span>,<span class="number">6</span>,<span class="number">7</span>,<span class="number">8</span>,<span class="number">9</span>,<span class="number">10</span>&#125;;</span><span class="line">    <span class="type">int</span> B[<span class="number">10</span>] = &#123;<span class="number">11</span>,<span class="number">12</span>,<span class="number">13</span>,<span class="number">14</span>,<span class="number">15</span>,<span class="number">16</span>,<span class="number">17</span>,<span class="number">18</span>,<span class="number">19</span>,<span class="number">20</span>&#125;;</span><span class="line">    <span class="type">int</span> C[<span class="number">10</span>] = &#123;<span class="number">0</span>&#125;;</span><span class="line">    <span class="type">int</span> i = <span class="number">0</span>;</span><span class="line">    <span class="type">int</span> sz = <span class="keyword">sizeof</span>(A)/<span class="keyword">sizeof</span>(A[<span class="number">0</span>]);</span><span class="line">    <span class="keyword">for</span> (i = <span class="number">0</span>; i&lt;sz; i++) &#123;</span><span class="line">        C[i] = A[i];</span><span class="line">    &#125;</span><span class="line">    <span class="keyword">for</span> (i = <span class="number">0</span>; i&lt;sz; i++) &#123;</span><span class="line">        A[i] = B[i];</span><span class="line">    &#125;</span><span class="line">    <span class="keyword">for</span> (i = <span class="number">0</span>; i&lt;sz; i++) &#123;</span><span class="line">        B[i] = C[i];</span><span class="line">    &#125;</span><span class="line">    <span class="keyword">for</span> (i = <span class="number">0</span>; i&lt;sz; i++) &#123;</span><span class="line">        <span class="built_in">printf</span>(<span class="string">&quot;%d &quot;</span>,A[i]);</span><span class="line">    &#125;</span><span class="line">    <span class="built_in">printf</span>(<span class="string">&quot;\n&quot;</span>);</span><span class="line">    <span class="keyword">for</span> (i = <span class="number">0</span>; i&lt;sz; i++) &#123;</span><span class="line">        <span class="built_in">printf</span>(<span class="string">&quot;%d &quot;</span>,B[i]);</span><span class="line">    &#125;</span><span class="line">&#125;</span></pre></td></tr></table></figure></div><div class="post-tags"><a href="/tags/C/" class="post-tag"># C</a></div><nav class="post-nav"><a href="/posts/da238f3f.html" class="post-nav-prev" title="操作符练习">&larr; 操作符练习 </a><a href="/posts/89734f24.html" class="post-nav-next" title="初识指针">初识指针 &rarr;</a></nav></article></div></div></div
