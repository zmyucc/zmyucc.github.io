r class="site-header"><div class="header-inner"><div class="site-brand"><a href="/" class="site-title">Zmyu&#39;s Blog</a></div><nav class="site-nav"><ul class="nav-menu"><li class="nav-item"><a href="/">首页</a></li><li class="nav-item"><a href="/about/">关于</a></li><li class="nav-item"><a href="/tags/C/">C语言</a></li><li class="nav-item"><a href="/tags/PLC/">PLC</a></li><li class="nav-item"><a href="/tags/STM32/">STM32</a></li><li class="nav-item"><a href="/archives/">归档</a></li><li class="nav-item nav-item-search"><a href="javascript:void(0);" onclick="window.showPureSearch&&window.showPureSearch()" title="搜索" class="search-trigger"><svg class="search-icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></a></li></ul></nav></div></header><main class="main"><div class="main-inner"><div class="content-wrap"><div class="content"><article class="post-detail" itemscope itemtype="http://schema.org/Article"><header class="post-header"><h1 class="post-title" itemprop="name headline">6-2定时器定时中断&amp;定时器外部时钟</h1><div class="post-meta"><span class="post-time">发表于 <time itemprop="datePublished" datetime="2025-12-30T19:00:00+08:00">2025-12-30</time></span></div></header><div class="post-body" itemprop="articleBody"><h3 id="常用TIM函数"><a href="#常用TIM函数" class="headerlink" title="常用TIM函数"></a>常用TIM函数</h3><figure class="highlight c"><table><tr><td class="gutter"><pre><span class="line">1</span><span class="line">2</span><span class="line">3</span><span class="line">4</span><span class="line">5</span><span class="line">6</span><span class="line">7</span><span class="line">8</span><span class="line">9</span><span class="line">10</span><span class="line">11</span><span class="line">12</span><span class="line">13</span><span class="line">14</span><span class="line">15</span><span class="line">16</span><span class="line">17</span><span class="line">18</span><span class="line">19</span><span class="line">20</span><span class="line">21</span><span class="line">22</span></pre></td><td class="code"><pre><span class="line"><span class="type">void</span> <span class="title function_">TIM_DeInit</span><span class="params">(TIM_TypeDef* TIMx)</span>;<span class="comment">//恢复缺省配置</span></span><span class="line"><span class="type">void</span> <span class="title function_">TIM_TimeBaseInit</span><span class="params">(TIM_TypeDef* TIMx, TIM_TimeBaseInitTypeDef* TIM_TimeBaseInitStruct)</span>;<span class="comment">//时基单元初始化，配置时基单元</span></span><span class="line"><span class="type">void</span> <span class="title function_">TIM_TimeBaseStructInit</span><span class="params">(TIM_TimeBaseInitTypeDef* TIM_TimeBaseInitStruct)</span>;<span class="comment">//把结构体变量赋默认值</span></span><span class="line"><span class="type">void</span> <span class="title function_">TIM_Cmd</span><span class="params">(TIM_TypeDef* TIMx, FunctionalState NewState)</span>;<span class="comment">//使能计数器</span></span><span class="line"><span class="type">void</span> <span class="title function_">TIM_ITConfig</span><span class="params">(TIM_TypeDef* TIMx, <span class="type">uint16_t</span> TIM_IT, FunctionalState NewState)</span>;<span class="comment">//使能中断输出信号</span></span><span class="line"><span class="type">void</span> <span class="title function_">TIM_InternalClockConfig</span><span class="params">(TIM_TypeDef* TIMx)</span>;<span class="comment">//选择内部时钟</span></span><span class="line"><span class="type">void</span> <span class="title function_">TIM_ITRxExternalClockConfig</span><span class="params">(TIM_TypeDef* TIMx, <span class="type">uint16_t</span> TIM_InputTriggerSource)</span>;<span class="comment">//选择ITRx其他定时器的时钟</span></span><span class="line"><span class="type">void</span> <span class="title function_">TIM_TIxExternalClockConfig</span><span class="params">(TIM_TypeDef* TIMx, <span class="type">uint16_t</span> TIM_TIxExternalCLKSource,<span class="type">uint16_t</span> TIM_ICPolarity, <span class="type">uint16_t</span> ICFilter)</span>;<span class="comment">//选择TIX捕获通道的时钟</span></span><span class="line"><span class="type">void</span> <span class="title function_">TIM_ETRClockMode1Config</span><span class="params">(TIM_TypeDef* TIMx, <span class="type">uint16_t</span> TIM_ExtTRGPrescaler, <span class="type">uint16_t</span> TIM_ExtTRGPolarity,<span class="type">uint16_t</span> ExtTRGFilter)</span>;<span class="comment">//选择ETR通过外部时钟模式1输入的时钟</span></span><span class="line"><span class="type">void</span> <span class="title function_">TIM_ETRClockMode2Config</span><span class="params">(TIM_TypeDef* TIMx, <span class="type">uint16_t</span> TIM_ExtTRGPrescaler, <span class="type">uint16_t</span> TIM_ExtTRGPolarity, <span class="type">uint16_t</span> ExtTRGFilter)</span>;<span class="comment">//选择ETR通过外部时钟模式2输入的时钟</span></span><span class="line"><span class="type">void</span> <span class="title function_">TIM_ETRConfig</span><span class="params">(TIM_TypeDef* TIMx, <span class="type">uint16_t</span> TIM_ExtTRGPrescaler, <span class="type">uint16_t</span> TIM_ExtTRGPolarity,<span class="type">uint16_t</span> ExtTRGFilter)</span>;<span class="comment">//配置ETR引脚的预分频器、极性、滤波器参数</span></span><span class="line"><span class="type">void</span> <span class="title function_">TIM_PrescalerConfig</span><span class="params">(TIM_TypeDef* TIMx, <span class="type">uint16_t</span> Prescaler, <span class="type">uint16_t</span> TIM_PSCReloadMode)</span>;<span class="comment">//单独写预分频值</span></span><span class="line"><span class="type">void</span> <span class="title function_">TIM_CounterModeConfig</span><span class="params">(TIM_TypeDef* TIMx, <span class="type">uint16_t</span> TIM_CounterMode)</span>;<span class="comment">//改变计数器的计数模式</span></span><span class="line"><span class="type">void</span> <span class="title function_">TIM_ARRPreloadConfig</span><span class="params">(TIM_TypeDef* TIMx, FunctionalState NewState)</span>;<span class="comment">//自动重装器预装功能配置</span></span><span class="line"><span class="type">void</span> <span class="title function_">TIM_SetCounter</span><span class="params">(TIM_TypeDef* TIMx, <span class="type">uint16_t</span> Counter)</span>;<span class="comment">//给计数器写一个值，手动给一个计数值</span></span><span class="line"><span class="type">void</span> <span class="title function_">TIM_SetAutoreload</span><span class="params">(TIM_TypeDef* TIMx, <span class="type">uint16_t</span> Autoreload)</span>;<span class="comment">//给自动重装器一个值，手动给一个自动重装值</span></span><span class="line"><span class="type">uint16_t</span> <span class="title function_">TIM_GetCounter</span><span class="params">(TIM_TypeDef* TIMx)</span>;<span class="comment">//获取当前计数器的值</span></span><span class="line"><span class="type">uint16_t</span> <span class="title function_">TIM_GetPrescaler</span><span class="params">(TIM_TypeDef* TIMx)</span>;<span class="comment">//获取当前预分频器的值</span></span><span class="line">FlagStatus <span class="title function_">TIM_GetFlagStatus</span><span class="params">(TIM_TypeDef* TIMx, <span class="type">uint16_t</span> TIM_FLAG)</span>;<span class="comment">//获取标志位</span></span><span class="line"><span class="type">void</span> <span class="title function_">TIM_ClearFlag</span><span class="params">(TIM_TypeDef* TIMx, <span class="type">uint16_t</span> TIM_FLAG)</span>;<span class="comment">//清除标志位</span></span><span class="line">ITStatus <span class="title function_">TIM_GetITStatus</span><span class="params">(TIM_TypeDef* TIMx, <span class="type">uint16_t</span> TIM_IT)</span>;<span class="comment">//获取标志位，中断程序使用</span></span><span class="line"><span class="type">void</span> <span class="title function_">TIM_ClearITPendingBit</span><span class="params">(TIM_TypeDef* TIMx, <span class="type">uint16_t</span> TIM_IT)</span>;<span class="comment">//清除标志位，中断程序使用</span></span></pre></td></tr></table></figure><h3 id="定时器定时中断"><a href="#定时器定时中断" class="headerlink" title="定时器定时中断"></a>定时器定时中断</h3><p>Timer.c</p><figure class="highlight c"><table><tr><td class="gutter"><pre><span class="line">1</span><span class="line">2</span><span class="line">3</span><span class="line">4</span><span class="line">5</span><span class="line">6</span><span class="line">7</span><span class="line">8</span><span class="line">9</span><span class="line">10</span><span class="line">11</span><span class="line">12</span><span class="line">13</span><span class="line">14</span><span class="line">15</span><span class="line">16</span><span class="line">17</span><span class="line">18</span><span class="line">19</span><span class="line">20</span><span class="line">21</span><span class="line">22</span><span class="line">23</span><span class="line">24</span><span class="line">25</span><span class="line">26</span><span class="line">27</span><span class="line">28</span><span class="line">29</span><span class="line">30</span><span class="line">31</span><span class="line">32</span><span class="line">33</span><span class="line">34</span><span class="line">35</span><span class="line">36</span><span class="line">37</span></pre></td><td class="code"><pre><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&quot;stm32f10x.h&quot;</span>                  <span class="comment">// Device header</span></span></span><span class="line"><span class="keyword">extern</span> <span class="type">uint16_t</span> Num;<span class="comment">//声明对应main里的Num</span></span><span class="line"><span class="type">void</span> <span class="title function_">Timer_Init</span><span class="params">(<span class="type">void</span>)</span></span><span class="line">&#123;</span><span class="line">	RCC_APB1PeriphClockCmd(RCC_APB1Periph_TIM2,ENABLE);<span class="comment">//开启时钟，TIM2是APB1总线的外设</span></span><span class="line">	TIM_InternalClockConfig(TIM2);<span class="comment">//选择为内部时钟，选择TIM2，由内部时基驱动，这一行可以不写，因为会默认调用内部时钟</span></span><span class="line">	TIM_TimeBaseInitTypeDef TIM_TimeBaseInitStructure;<span class="comment">//配置时基单元结构体</span></span><span class="line">	TIM_TimeBaseInitStructure.TIM_ClockDivision = TIM_CKD_DIV1;<span class="comment">//结构体成员：分频参数</span></span><span class="line">	TIM_TimeBaseInitStructure.TIM_CounterMode = TIM_CounterMode_Up;<span class="comment">//结构体成员：计数模式，可以向上计数，向下计数，三种中央对齐模式</span></span><span class="line">	TIM_TimeBaseInitStructure.TIM_Period = <span class="number">10000</span> - <span class="number">1</span>;<span class="comment">//结构体成员：ARR自动重装器的值</span></span><span class="line">	TIM_TimeBaseInitStructure.TIM_Prescaler = <span class="number">7200</span> - <span class="number">1</span>;<span class="comment">//结构体成员：PSC预分频器的值，要参考6-1TIM定时中断计算</span></span><span class="line">	TIM_TimeBaseInitStructure.TIM_RepetitionCounter = <span class="number">0</span>;<span class="comment">//结构体成员：重复计数器的值</span></span><span class="line">	TIM_TimeBaseInit(TIM2,&amp;TIM_TimeBaseInitStructure);<span class="comment">//完成配置时基单元</span></span><span class="line">&nbsp;</span><span class="line">	TIM_ClearFlag(TIM2,TIM_FLAG_Update);</span><span class="line">	TIM_ITConfig(TIM2,TIM_IT_Update,ENABLE);<span class="comment">//使能中断，更新中断</span></span><span class="line">&nbsp;</span><span class="line">	NVIC_PriorityGroupConfig(NVIC_PriorityGroup_2);<span class="comment">//NVIC优先级分组，选择分组2</span></span><span class="line">	NVIC_InitTypeDef NVIC_InitStructure;<span class="comment">//NVIC结构体</span></span><span class="line">	NVIC_InitStructure.NVIC_IRQChannel = TIM2_IRQn;<span class="comment">//结构体参数：中断通道</span></span><span class="line">	NVIC_InitStructure.NVIC_IRQChannelCmd = ENABLE;<span class="comment">//结构体参数：使能</span></span><span class="line">	NVIC_InitStructure.NVIC_IRQChannelPreemptionPriority = <span class="number">2</span>;<span class="comment">//结构体参数：抢占优先级</span></span><span class="line">	NVIC_InitStructure.NVIC_IRQChannelSubPriority = <span class="number">1</span>;<span class="comment">//结构体参数：响应优先级</span></span><span class="line">	NVIC_Init(&amp;NVIC_InitStructure);<span class="comment">//完成配置NVIC</span></span><span class="line">&nbsp;</span><span class="line">	TIM_Cmd(TIM2,ENABLE);<span class="comment">//使能通道</span></span><span class="line">&#125;</span><span class="line">&nbsp;</span><span class="line"><span class="type">void</span> <span class="title function_">TIM2_IRQHandler</span><span class="params">(<span class="type">void</span>)</span><span class="comment">//TIM2的中断函数</span></span><span class="line">&#123;</span><span class="line">	<span class="keyword">if</span> (TIM_GetITStatus(TIM2,TIM_IT_Update) == SET)<span class="comment">//检查标志位</span></span><span class="line">	&#123;</span><span class="line">		Num ++;</span><span class="line">		TIM_ClearITPendingBit(TIM2,TIM_IT_Update);<span class="comment">//清除标志位</span></span><span class="line">	&#125;</span><span class="line">&#125;</span><span class="line">&nbsp;</span></pre></td></tr></table></figure><p>main.c</p><figure class="highlight c"><table><tr><td class="gutter"><pre><span class="line">1</span><span class="line">2</span><span class="line">3</span><span class="line">4</span><span class="line">5</span><span class="line">6</span><span class="line">7</span><span class="line">8</span><span class="line">9</span><span class="line">10</span><span class="line">11</span><span class="line">12</span><span class="line">13</span><span class="line">14</span><span class="line">15</span><span class="line">16</span><span class="line">17</span><span class="line">18</span><span class="line">19</span><span class="line">20</span><span class="line">21</span></pre></td><td class="code"><pre><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&quot;stm32f10x.h&quot;</span>                  <span class="comment">// Device header</span></span></span><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&quot;Delay.h&quot;</span></span></span><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&quot;OLED.h&quot;</span></span></span><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&quot;Timer.h&quot;</span></span></span><span class="line">&nbsp;</span><span class="line"><span class="type">uint16_t</span> Num;<span class="comment">//定义一个16位的全局变量Num</span></span><span class="line"><span class="type">int</span> <span class="title function_">main</span><span class="params">(<span class="type">void</span>)</span></span><span class="line">&#123;</span><span class="line">	OLED_Init();</span><span class="line">	Timer_Init();</span><span class="line">	OLED_ShowString(<span class="number">1</span>,<span class="number">1</span>,<span class="string">&quot;Num:&quot;</span>);</span><span class="line">&nbsp;</span><span class="line">	<span class="keyword">while</span>(<span class="number">1</span>)</span><span class="line">	&#123;</span><span class="line">		OLED_ShowNum(<span class="number">1</span>,<span class="number">5</span>,Num,<span class="number">5</span>);</span><span class="line">		OLED_ShowNum(<span class="number">2</span>,<span class="number">5</span>,TIM_GetCounter(TIM2),<span class="number">5</span>);<span class="comment">//获取TIM2当前计数器的值</span></span><span class="line">	&#125;</span><span class="line">&nbsp;</span><span class="line">&#125;</span><span class="line">&nbsp;</span><span class="line">&nbsp;</span></pre></td></tr></table></figure><h3 id="定时器外部时钟"><a href="#定时器外部时钟" class="headerlink" title="定时器外部时钟"></a>定时器外部时钟</h3><figure class="highlight c"><table><tr><td class="gutter"><pre><span class="line">1</span><span class="line">2</span><span class="line">3</span><span class="line">4</span><span class="line">5</span><span class="line">6</span><span class="line">7</span><span class="line">8</span><span class="line">9</span><span class="line">10</span><span class="line">11</span><span class="line">12</span><span class="line">13</span><span class="line">14</span><span class="line">15</span><span class="line">16</span><span class="line">17</span><span class="line">18</span><span class="line">19</span><span class="line">20</span><span class="line">21</span><span class="line">22</span><span class="line">23</span><span class="line">24</span><span class="line">25</span><span class="line">26</span><span class="line">27</span><span class="line">28</span><span class="line">29</span><span class="line">30</span><span class="line">31</span><span class="line">32</span><span class="line">33</span><span class="line">34</span><span class="line">35</span><span class="line">36</span><span class="line">37</span><span class="line">38</span><span class="line">39</span><span class="line">40</span><span class="line">41</span><span class="line">42</span><span class="line">43</span><span class="line">44</span><span class="line">45</span><span class="line">46</span><span class="line">47</span><span class="line">48</span><span class="line">49</span><span class="line">50</span><span class="line">51</span><span class="line">52</span></pre></td><td class="code"><pre><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&quot;stm32f10x.h&quot;</span>                  <span class="comment">// Device header</span></span></span><span class="line"><span class="keyword">extern</span> <span class="type">uint16_t</span> Num;</span><span class="line"><span class="type">void</span> <span class="title function_">Timer_Init</span><span class="params">(<span class="type">void</span>)</span></span><span class="line">&#123;</span><span class="line">	RCC_APB1PeriphClockCmd(RCC_APB1Periph_TIM2,ENABLE);</span><span class="line">&nbsp;</span><span class="line">	RCC_APB2PeriphClockCmd(RCC_APB2Periph_GPIOA,ENABLE);<span class="comment">//使能GPIOA</span></span><span class="line">	GPIO_InitTypeDef GPIO_InitStructure;</span><span class="line">	GPIO_InitStructure.GPIO_Mode = GPIO_Mode_IPU;<span class="comment">//上拉输入</span></span><span class="line">	GPIO_InitStructure.GPIO_Pin = GPIO_Pin_0;</span><span class="line">	GPIO_InitStructure.GPIO_Speed = GPIO_Speed_50MHz;</span><span class="line">	GPIO_Init(GPIOA,&amp;GPIO_InitStructure);</span><span class="line">&nbsp;</span><span class="line">&nbsp;</span><span class="line">	TIM_ETRClockMode2Config(TIM2,TIM_ExtTRGPSC_OFF,TIM_ExtTRGPolarity_NonInverted,<span class="number">0x0F</span>);<span class="comment">//通过ETR引脚的外部时钟模式2配置</span></span><span class="line">&nbsp;</span><span class="line">	TIM_TimeBaseInitTypeDef TIM_TimeBaseInitStructure;</span><span class="line">	TIM_TimeBaseInitStructure.TIM_ClockDivision = TIM_CKD_DIV1;<span class="comment">//分频参数</span></span><span class="line">	TIM_TimeBaseInitStructure.TIM_CounterMode = TIM_CounterMode_Up;<span class="comment">//计数模式</span></span><span class="line">	TIM_TimeBaseInitStructure.TIM_Period = <span class="number">10</span> - <span class="number">1</span>;<span class="comment">//ARR</span></span><span class="line">	TIM_TimeBaseInitStructure.TIM_Prescaler = <span class="number">1</span> - <span class="number">1</span>;<span class="comment">//PSC</span></span><span class="line">	TIM_TimeBaseInitStructure.TIM_RepetitionCounter = <span class="number">0</span>;</span><span class="line">	TIM_TimeBaseInit(TIM2,&amp;TIM_TimeBaseInitStructure);</span><span class="line">&nbsp;</span><span class="line">	TIM_ClearFlag(TIM2,TIM_FLAG_Update);</span><span class="line">	TIM_ITConfig(TIM2,TIM_IT_Update,ENABLE);</span><span class="line">&nbsp;</span><span class="line">	NVIC_PriorityGroupConfig(NVIC_PriorityGroup_2);</span><span class="line">	NVIC_InitTypeDef NVIC_InitStructure;</span><span class="line">	NVIC_InitStructure.NVIC_IRQChannel = TIM2_IRQn;</span><span class="line">	NVIC_InitStructure.NVIC_IRQChannelCmd = ENABLE;</span><span class="line">	NVIC_InitStructure.NVIC_IRQChannelPreemptionPriority = <span class="number">2</span>;</span><span class="line">	NV
