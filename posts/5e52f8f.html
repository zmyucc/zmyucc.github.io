 class="header-inner"><div class="site-brand"><a href="/" class="site-title">Zmyu&#39;s Blog</a></div><nav class="site-nav"><ul class="nav-menu"><li class="nav-item"><a href="/">首页</a></li><li class="nav-item"><a href="/about/">关于</a></li><li class="nav-item"><a href="/tags/C/">C语言</a></li><li class="nav-item"><a href="/tags/PLC/">PLC</a></li><li class="nav-item"><a href="/tags/STM32/">STM32</a></li><li class="nav-item"><a href="/archives/">归档</a></li><li class="nav-item nav-item-search"><a href="javascript:void(0);" onclick="window.showPureSearch&&window.showPureSearch()" title="搜索" class="search-trigger"><svg class="search-icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></a></li></ul></nav></div></header><main class="main"><div class="main-inner"><div class="content-wrap"><div class="content"><article class="post-detail" itemscope itemtype="http://schema.org/Article"><header class="post-header"><h1 class="post-title" itemprop="name headline">兔子生崽问题</h1><div class="post-meta"><span class="post-time">发表于 <time itemprop="datePublished" datetime="2024-10-30T18:30:00+08:00">2024-10-30</time></span></div></header><div class="post-body" itemprop="articleBody"><p>兔子在出生两个月后，就有繁殖能力，一对兔子每个月能生出一对小兔子（一公一母）来。如果所有兔子都不死，那么一年以后可以繁殖多少对兔子？</p><figure class="highlight c"><table><tr><td class="gutter"><pre><span class="line">1</span><span class="line">2</span><span class="line">3</span><span class="line">4</span><span class="line">5</span><span class="line">6</span><span class="line">7</span><span class="line">8</span><span class="line">9</span><span class="line">10</span><span class="line">11</span><span class="line">12</span><span class="line">13</span><span class="line">14</span><span class="line">15</span><span class="line">16</span><span class="line">17</span></pre></td><td class="code"><pre><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;stdio.h&gt;</span></span></span><span class="line"><span class="type">int</span> <span class="title function_">main</span><span class="params">()</span></span><span class="line">&#123;</span><span class="line">    <span class="type">int</span> month = <span class="number">0</span>;</span><span class="line">    <span class="type">int</span> Birth = <span class="number">1</span>;<span class="comment">//新生兔子数</span></span><span class="line">    <span class="type">int</span> One_Months_Old = <span class="number">0</span>;<span class="comment">//一个月大的兔子数</span></span><span class="line">    <span class="type">int</span> Adult = <span class="number">0</span>;<span class="comment">//成年兔子数</span></span><span class="line">    <span class="type">int</span> sum = <span class="number">0</span>;<span class="comment">//总数</span></span><span class="line">    <span class="keyword">while</span> (month &lt;= <span class="number">40</span>) &#123;</span><span class="line">        Adult = Adult + One_Months_Old;<span class="comment">//一个月大的兔子成年了</span></span><span class="line">        One_Months_Old = Birth;<span class="comment">//新生兔子一个月大了</span></span><span class="line">        Birth = Adult;<span class="comment">//成年的兔子生出一对新兔子</span></span><span class="line">        month++;<span class="comment">//月份增长</span></span><span class="line">        sum = Birth + One_Months_Old + Adult;<span class="comment">//兔子总数</span></span><span class="line">        <span class="built_in">printf</span>(<span class="string">&quot;Month = %d, Sum = %d\n&quot;</span>,month,sum);</span><span class="line">    &#125;</span><span class="line">&#125;</span></pre></td></tr></table></figure><p>相关问题：<a href="https://blog.zmyu.cc/posts/65cc8f41.html#%E9%80%92%E5%BD%92%E4%B8%8E%E8%BF%AD%E4%BB%A3">斐波那契数列</a></p></div><div class="post-tags"><a href="/tags/C/" class="post-tag"># C</a></div><nav class="post-nav"><
