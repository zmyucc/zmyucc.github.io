TypeDef GPIO_InitStructure;</span><span class="line">	GPIO_InitStructure.GPIO_Mode = GPIO_Mode_IPU;<span class="comment">//上拉输入，默认高电平</span></span><span class="line">	GPIO_InitStructure.GPIO_Pin = GPIO_Pin_1 | GPIO_Pin_0;</span><span class="line">	GPIO_InitStructure.GPIO_Speed = GPIO_Speed_50MHz;</span><span class="line">	GPIO_Init(GPIOB, &amp;GPIO_InitStructure);</span><span class="line">	<span class="comment">//配置AFIO外设</span></span><span class="line">	GPIO_EXTILineConfig(GPIO_PortSourceGPIOB,GPIO_PinSource0);</span><span class="line">	GPIO_EXTILineConfig(GPIO_PortSourceGPIOB,GPIO_PinSource1);</span><span class="line">&nbsp;</span><span class="line">	EXTI_InitTypeDef EXTI_InitStructure;</span><span class="line">	EXTI_InitStructure.EXTI_Line = EXTI_Line0 | EXTI_Line1;</span><span class="line">	EXTI_InitStructure.EXTI_LineCmd = ENABLE;</span><span class="line">	EXTI_InitStructure.EXTI_Mode = EXTI_Mode_Interrupt;</span><span class="line">	EXTI_InitStructure.EXTI_Trigger = EXTI_Trigger_Falling;</span><span class="line">	EXTI_Init(&amp;EXTI_InitStructure);</span><span class="line">	<span class="comment">//配置NVIC</span></span><span class="line">	NVIC_PriorityGroupConfig(NVIC_PriorityGroup_2);<span class="comment">//整个芯片只执行一次，即整个工程只运行一次此代码</span></span><span class="line">	NVIC_InitTypeDef NVIC_InitStructure;</span><span class="line">	NVIC_InitStructure.NVIC_IRQChannel = EXTI0_IRQn;</span><span class="line">	NVIC_InitStructure.NVIC_IRQChannelCmd = ENABLE;</span><span class="line">	NVIC_InitStructure.NVIC_IRQChannelPreemptionPriority = <span class="number">1</span>;</span><span class="line">	NVIC_InitStructure.NVIC_IRQChannelSubPriority = <span class="number">1</span>;</span><span class="line">	NVIC_Init(&amp;NVIC_InitStructure);</span><span class="line">&nbsp;</span><span class="line">	NVIC_InitStructure.NVIC_IRQChannel = EXTI1_IRQn;</span><span class="line">	NVIC_InitStructure.NVIC_IRQChannelCmd = ENABLE;</span><span class="line">	NVIC_InitStructure.NVIC_IRQChannelPreemp
