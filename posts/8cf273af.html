er"><div class="site-brand"><a href="/" class="site-title">Zmyu&#39;s Blog</a></div><nav class="site-nav"><ul class="nav-menu"><li class="nav-item"><a href="/">首页</a></li><li class="nav-item"><a href="/about/">关于</a></li><li class="nav-item"><a href="/tags/C/">C语言</a></li><li class="nav-item"><a href="/tags/PLC/">PLC</a></li><li class="nav-item"><a href="/tags/STM32/">STM32</a></li><li class="nav-item"><a href="/archives/">归档</a></li><li class="nav-item nav-item-search"><a href="javascript:void(0);" onclick="window.showPureSearch&&window.showPureSearch()" title="搜索" class="search-trigger"><svg class="search-icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></a></li></ul></nav></div></header><main class="main"><div class="main-inner"><div class="content-wrap"><div class="content"><article class="post-detail" itemscope itemtype="http://schema.org/Article"><header class="post-header"><h1 class="post-title" itemprop="name headline">条件运算符（三目运算符）的嵌套</h1><div class="post-meta"><span class="post-time">发表于 <time itemprop="datePublished" datetime="2024-10-31T12:18:00+08:00">2024-10-31</time></span></div></header><div class="post-body" itemprop="articleBody"><p>题目：利用条件运算符的嵌套来完成此题：学习成绩&gt;&#x3D;90分的同学用A表示，60-89分之间的用B表示，60分以下的用C表示。<br>程序分析：（a&gt;b）？a:b这是条件运算符的基本例子。<br>参考：<a href="https://blog.zmyu.cc/posts/d3c4a0cd.html#%E6%9D%A1%E4%BB%B6%E6%93%8D%E4%BD%9C%E7%AC%A6%EF%BC%88%E4%B8%89%E7%9B%AE%E6%93%8D%E4%BD%9C%E7%AC%A6%EF%BC%89">条件运算符</a></p><hr><p>使用一个三目运算符：</p><figure class="highlight c"><table><tr><td class="gutter"><pre><span class="line">1</span><span class="line">2</span><span class="line">3</span><span class="line">4</span><span class="line">5</span><span class="line">6</span><span class="line">7</span><span class="line">8</span><span class="line">9</span><span class="line">10</span><span class="line">11</span><span class="line">12</span><span class="line">13</span><span class="line">14</span><span class="line">15</span></pre></td><td class="code"><pre><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;stdio.h&gt;</span></span></span><span class="line"><span class="type">int</span> <span class="title function_">main</span><span class="params">()</span> &#123;</span><span class="line">    <span class="type">int</span> input = <span class="number">0</span>;</span><span class="line">    <span class="type">char</span> grade;</span><span class="line">    <span class="built_in">printf</span>(<span class="string">&quot;请输入成绩:-&gt;&quot;</span>);</span><span class="line">    <span class="built_in">scanf</span>(<span class="string">&quot;%d&quot;</span>,&amp;input);</span><span class="line">    <span class="keyword">if</span> (input&gt;=<span class="number">60</span>) &#123;</span><span class="line">        grade = (input&gt;=<span class="number">90</span>) ? <span class="string">&#x27;A&#x27;</span> : <span class="string">&#x27;B&#x27;</span>;</span><span class="line">    &#125;<span class="keyword">else</span></span><span class="line">    &#123;</span><span class="line">        grade = <span class="string">&#x27;C&#x27;</span>;</span><span class="line">    &#125;</span><span class="line">    <span class="built_in">printf</span>(<span class="string">&quot;%c\n&quot;</span>,grade);</span><span class="line">    <span class="keyword">return</span> <span class="number">0</span>;</span><span class="line">&#125;</span></pre></td></tr></table></figure><p>改进后的代码（使用三目运算符的嵌套）：</p><figure class="highlight c"><table><tr><td class="gutter"><pre><span class="line">1</span><span class="line">2</span><span class="line">3</span><span class="line">4</span><span class="line">5</span><span class="line">6</span><span class="line">7</span><span class="line">8</span><span class="line">9</span><span class="line">10</span></pre></td><td class="code"><pre><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;stdio.h&gt;</span></span></span><span class="line"><span class="type">int</span> <span class="title function_">main</span><span class="params">()</span> &#123;</span><span class="line">    <span class="type">int</span> input = <span class="number">0</span>;</span><span class="line">    <span class="type">char</span> grade;</span><span class="line">    <span class="built_in">printf</span>(<span class="string">&quot;请输入成绩:-&gt;&quot;</span>);</span><span class="line">    <span class="built_in">scanf</span>(<span class="string">&quot;%d&quot;</span>,&amp;input);</span><span class="line">    grade = (input&gt;=<span class="number">90</span>)? <span class="string">&#x27;A&#x27;</span> : (input&gt;=<span class="number">60</span>) ? <span class="string">&#x27;B&#x27;</span> : <span class="string">&#x27;C&#x27;</span>;</span><span class="line">    <span class="built_in">printf</span>(<span class="string">&quot;%c\n&quot;</span>,grade);</span><span class="line">    <span class="keyword">return</span> <span class="number">0</span>;</span><span class="line">&#125;</span></pre></td></tr></table></figure></div><div class="post-tags"><a href="/tags/C/" class="post-tag"># C</a></div><nav class="post-nav"><a href="/posts/ee2f5b4f.html" class="post-nav-prev" title="最大公约数和最小公倍数">&larr; 最大公约数和最小公倍数 </a><a href="/posts/b133b15f.html" class="post-nav-next" title="将一个正整数分解质因数">将一个正整数分解质因数 &rarr;</a></nav></article></div></div></div></main><footer class="site-footer"><div class="footer-inner"><div class="footer-line"></div><div class="copyright">&copy; 2022 - 2026 <span>Zmyu&#39;s Blog</span></div></div></footer><div id="search-overlay" class="search-overlay"><div class="search-popup"><div class="search-header"><span class="search-icon">&#128269;</span> <input type="text" id="search-input" class="search-input" placeholder="输入关键字搜索..." autocomplete="off" auto
