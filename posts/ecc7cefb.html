span class="line">21</span><span class="line">22</span><span class="line">23</span><span class="line">24</span><span class="line">25</span><span class="line">26</span><span class="line">27</span><span class="line">28</span><span class="line">29</span><span class="line">30</span><span class="line">31</span><span class="line">32</span><span class="line">33</span><span class="line">34</span><span class="line">35</span><span class="line">36</span><span class="line">37</span><span class="line">38</span><span class="line">39</span><span class="line">40</span><span class="line">41</span><span class="line">42</span><span class="line">43</span><span class="line">44</span></pre></td><td class="code"><pre><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;stdio.h&gt;</span></span></span><span class="line"><span class="type">int</span> <span class="title function_">Cal_Josephus</span><span class="params">(<span class="type">int</span> input,<span class="type">int</span>* arr)</span></span><span class="line">&#123;</span><span class="line">    <span class="type">int</span> i = <span class="number">0</span>;</span><span class="line">    <span class="type">int</span> j = <span class="number">0</span>;</span><span class="line">    <span class="type">int</span> stay = input;</span><span class="line">    <span class="type">int</span> ret = <span class="number">1</span>;</span><span class="line">    <span class="keyword">while</span> (stay&gt;<span class="number">1</span>)<span class="comment">//当现在留下的人数大于1的时候，一直循环</span></span><span class="line">    &#123;</span><span class="line">        <span class="keyword">for</span> (i=<span class="number">0</span>; i&lt;input; i++)</span><span class="line">        &#123;</span><span class="line">            <span class="keyword">if</span> (arr[i] == <span class="number">1</span>)</span><span class="line">            &#123;</span><span class="line">                j++;</span><span class="line">
