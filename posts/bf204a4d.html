an class="line">17</span><span class="line">18</span><span class="line">19</span><span class="line">20</span><span class="line">21</span><span class="line">22</span><span class="line">23</span><span class="line">24</span><span class="line">25</span><span class="line">26</span><span class="line">27</span><span class="line">28</span><span class="line">29</span><span class="line">30</span><span class="line">31</span><span class="line">32</span><span class="line">33</span><span class="line">34</span><span class="line">35</span><span class="line">36</span><span class="line">37</span><span class="line">38</span><span class="line">39</span><span class="line">40</span><span class="line">41</span><span class="line">42</span></pre></td><td class="code"><pre><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;stdio.h&gt;</span></span></span><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;string.h&gt;</span></span></span><span class="line"><span class="type">int</span> <span class="title function_">strrindex</span><span class="params">(<span class="type">char</span> s[],<span class="type">char</span> t[])</span>;</span><span class="line"><span class="type">int</span> <span class="title function_">main</span><span class="params">()</span></span><span class="line">&#123;</span><span class="line">    <span class="type">char</span> s[] = <span class="string">&quot;abqqqcdqqefqgqhijkqqqqlmnopqqqqrsqqqqtqrqrqrscsdaadzcqraaaaqqqqqr&quot;</span>;</span><span class="line">    <span class="type">char</span> t[] = <span class="string">&quot;qr&quot;</span>;</span><span class="line">    <span class="type">int</span> Locate = strrindex(s,t);</span><span class="line">    <span class="keyword">return</span> <span class="number">0</span>;</span><span class="line">&#125;</span><span class="line"><span class="type">int</span> <span class="title function_">strrindex</span><span class="params">(<span class="type">char</span> s[],<span class="type">char</span> t[])</span></span><span class="line">&#123;</span><span class="line">    <span class="type">int</span> i = <span class="number">0</span>;</span><span class="line">    <span class="type">int</span> ret = <span class="number">-1</span>;</span><span class="line">    <span class="type">int</span> tLenth = <span class="built_in">strlen</span>(t);<span class="comment">//字符串t的长度</span></span><span class="line">    <span class="keyword">for</span> (i = <span class="number">0</span>; s[i] != <span class="string">&#x27;\0&#x27;</span>; i++)</span><span class="line">    &#123;</span><span class="line">        <span class="keyword">if</span> (s[i] == t[<span class="number">0</span>])<span class="comment">//s[i]和字符串t的首元素相等了</span></span><span class="line">        &#123;</span><span class="line">            <span class="type">int</span> j = <span class="number">0</span>;</span><span class="line">            <span class="keyword">for</span> (j = <span class="number">0</span>; j &lt; tLenth; j++)</span><span class="line">            &#123;</span><span class="line">                <span class="type">static</span> <span class="type">int</span> Count = <span class="number">0</span>;<span class="comment">//记录元素相等的个数，和t的长度相等时，代表找到了</span></span><span class="line">                <span class="keyword">if</span> (s[i+j] == t[j])<span class="comment">//其他元素也相等</span></span><span class="line">                &#123;</span><span class="line">                    Count++;</span><span class="line">                    <span class="keyword">if</span> (Count == tLenth)<span class="comment">//记录的相等个数和t的长度相等</span></span><span class="line">                    &#123;</span><span class="line">                        ret = i;</span><span class="line">                        Count = <span class="number">0</span>;<span class="comment">//记录清零，为了后面查找准备</span></span><span class="line">                    &#125;</span><span class="line">                &#125;</span><span class="line">                <span class="keyword">else</span><span class="comment">//出现了不相等的元素</span></span><span class="line">                &#123;</span><span class="line">                    Count = <span class="number">0</span>;<span class="comment">//记录清零</span></span><span class="line">                    <span class="keyword">break</span>;</span><span class="line">                &#125;</span><span class="line">            &#125;</span><span class="line">        &#125;</span><span class="line">    &#125;</span><span class="line">    <span class="keyword">return</span> ret;</span><span class="line">&#125;</span></pre></td></tr></table></figure><hr><p>代码：</p><figure class="highlight c"><table><tr><td class="gutter"><pre><span class="line">1</span><span class="line">2</span><span class="line">3</span><span class="line">4</span><span class="line">5</span><span class="line">6</span><span class="line">7</span><span class="line">8</span><span class="line">9</span><span class="line">10</span><span class="line">11</span><span class="line">12</span><span class="line">13</span><span class="line">14</span><span class="line">15</span><span class="line">16</span><span class="line">17</span><span class="line">18</span><span class="line">19</span><span class="line">20</span><span class="line">21</span><span class="line">22</span><span class="line">23</span><span class="line">24</span><span class="line">25</span><span class="line">26</span><span class="line">27</span><span class="line">28</span><span class="line">29</span><span class="line">30</span><span class="line">31</span></pre></td><td class="code"><pre><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;stdio.h&gt;</span></span></span><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;string.h&gt;</span></span></span><span class="line"><span class="type">int</span> <span class="title function_">strrindex</span><span class="params">(<span class="type">char</span> s[], <span class="type">char</span> t[])</span>;</span><span class="line"><span class="type">int</span> <span class="title function_">main</span><span class="params">()</span> </span><span class="line">&#123;</span><span class="line">    <span class="type">char</span> s[] = <span class="string">&quot;abqqqcdqqefqgqhijkqqqqlmnopqqqqrsqqqqtqrqrqrscsdaadzcqraaaaqqqqqr&quot;</span>;</span><span class="line">    <span class="type">char</span> t[] = <span class="string">&quot;qraaa&quot;</span>;</span><span class="line">    <span class="type">int</span> Locate = strrindex(s, t);</span><span class="line">    <span class="keyword">return</span> <span class="number">0</span>;</span><span class="line">&#125;</span><span class="line"><span class="type">int</span> <span class="title function_">strrindex</span><span class="params">(<span class="type">char</span> s[], <span class="type">char</span> t[])</span> </span><span class="line">&#123;</span><span class="line">    <span class="type">int</span> sLength = <span class="built_in">strlen</span>(s);</span><span class="line">    <span class="type">int</span> tLength = <span class="built_in">strlen</span>(t);</span><span class="line">    <span class="type">int</span> i, j</span><span class="line">    <span class="title function_">for</span> <span class="params">(i = sLength - tLength; i &gt;= <span class="number">0</span>; i--)</span> <span class="comment">//从后往前找</span></span><span class="line">    &#123;</span><span class="line">        <span class="keyword">for</span> (j = <span class="number">0</span>; j &lt; tLength; j++) </span><span class="line">        &#123;</span><span class="line">            <span class="keyword">if</span> (s[i + j] != t[j]) <span class="comment">//不匹配的时候</span></span><span class="line">            &#123;</span><span class="line">                <span class="keyword">break</span>;</span><span class="line">            &#125;</span><span class="line">        &#125;</span><span class="line">        <span class="keyword">if</span> (j == tLength) <span class="comment">//找到了</span></span><span class="line">        &#123;</span><span class="line">            <span class="keyword">return</span> i;  <span class="comment">// 找到最后一次出现的位置</span></span><span class="line">        &#125;</span><span class="line">    &#125;</span><span class="line">    <span class="keyword">return</span> <span class="number">-1</span>;  <span class="comment">// 如果未找到</span></span><span class="line">&#125;</span></pre></td></tr></table></figure></div><div class="post-tags"><a href="/tags/C/" class="post-tag"># C</a> <a href="/tags/C%E7%A8%8B%E5%BA%8F%E8%AE%BE%E8%AE%A1%E8%AF%AD%E8%A8%80/" class="post-tag"># C程序设计语言</a></div><nav class="post-nav"><a href="/posts/77e00e4e.html" class="post-nav-prev" title="4-2：对atof函数进行扩充">&larr; 4-2：对atof函数进行扩充 </a><a href="/posts/f2bf76c4.html" class="post-nav-next" title="3-5：itob(n,s,b)">3-5：itob(n,s,b) &rarr;</a></nav></article></div></div></div></main><footer class="site-footer"><div class="footer-inner"><div class="footer-line"></div><div class="copyright">&copy; 2022 - 2026 <span>Zmyu&#39;s Blog</span></div></div></footer><div id="search-overlay" class="search-overlay"><div class="search-popup"><div class="search-header"><span class="search-icon">&#128269;</span> <input type="text" id="search-input" class="search-input" placeholder="输入关键字搜索..." autocomplete="off" autofocus> <span id="search-close" class="search-close">&times;</span></div><div id="search-results" class="search-results"></div></div></div><script src="/js/search.js?v=1.0.2"></script><script src="/js/main.js?v=1.0.2"></script><script src="/js/outdate.js"></script></body></html>
