ref="/" class="site-title">Zmyu&#39;s Blog</a></div><nav class="site-nav"><ul class="nav-menu"><li class="nav-item"><a href="/">首页</a></li><li class="nav-item"><a href="/about/">关于</a></li><li class="nav-item"><a href="/tags/C/">C语言</a></li><li class="nav-item"><a href="/tags/PLC/">PLC</a></li><li class="nav-item"><a href="/tags/STM32/">STM32</a></li><li class="nav-item"><a href="/archives/">归档</a></li><li class="nav-item nav-item-search"><a href="javascript:void(0);" onclick="window.showPureSearch&&window.showPureSearch()" title="搜索" class="search-trigger"><svg class="search-icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></a></li></ul></nav></div></header><main class="main"><div class="main-inner"><div class="content-wrap"><div class="content"><article class="post-detail" itemscope itemtype="http://schema.org/Article"><header class="post-header"><h1 class="post-title" itemprop="name headline">函数指针求倒数和</h1><div class="post-meta"><span class="post-time">发表于 <time itemprop="datePublished" datetime="2024-11-04T19:06:00+08:00">2024-11-04</time></span></div></header><div class="post-body" itemprop="articleBody"><p>题目：编写一个函数，输入n为偶数时，调用函数求1&#x2F;2+1&#x2F;4+…+1&#x2F;n。<br>当输入n为奇数时，调用函数1&#x2F;1+1&#x2F;3+…+1&#x2F;n（利用指针函数）。</p><p>指针函数：本质是一个函数，不过它的返回值是一个指针。<br>函数指针：本质是一个指针，该指针的地址指向了一个函数，所以它是指向函数的指针。</p><figure class="highlight c"><table><tr><td class="gutter"><pre><span class="line">1</span><span class="line">2</span><span class="line">3</span><span class="line">4</span><span class="line">5</span><span class="line">6</span><span class="line">7</span><span class="line">8</span><span class="line">9</span><span class="line">10</span><span class="line">11</span><span class="line">12</span><span class="line">13</span><span class="line">14</span><span class="line">15</span><span class="line">16</span><span class="line">17</span><span class="line">18</span><span class="line">19</span><span class="line">20</span><span class="line">21</span><span class="line">22</span><span class="line">23</span><span class="line">24</span><span class="line">25</span><span class="line">26</span><span class="line">27</span><span class="line">28</span><span class="line">29</span><span class="line">30</span><span class="line">31</span><span class="line">32</span><span class="line">33</span><span class="line">34</span><span class="line">35</span><span class="line">36</span><span class="line">37</span><span class="line">38</span><span class="line">39</span><span class="line">40</span><span class="line">41</span><span class="line">42</span></pre></td><td class="code"><pre><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;stdio.h&gt;</span></span></span><span class="line"><span class="type">float</span> <span class="title function_">Odd</span><span class="params">(<span class="type">int</span> n)</span><span class="comment">//求偶数的函数</span></span><span class="line">&#123;</span><span class="line">    <span class="type">float</span> i = <span class="number">2</span>;</span><span class="line">    <span class="type">float</span> sum = <span class="number">0.0</span>;</span><span class="line">    <span class="keyword">while</span> (i &lt;= n)</span><span class="line">    &#123;</span><span class="line">        sum = sum + <span class="number">1</span>/i;</span><span class="line">        i = i + <span class="number">2</span>;</span><span class="line">    &#125;</span><span class="line">    <span class="keyword">return</span> sum;</span><span class="line">&#125;</span><span class="line"><span class="type">float</span> <span class="title function_">Even</span><span class="params">(<span class="type">int</span> n)</span><span class="comment">//求奇数的函数</span></span><span class="line">&#123;</span><span class="line">    <span class="type">float</span> i = <span class="number">1</span>;</span><span class="line">    <span class="type">float</span> sum = <span class="number">0.0</span>;</span><span class="line">    <span class="keyword">while</span> (i &lt;= n)</span><span class="line">    &#123;</span><span class="line">        sum = sum + <span class="number">1</span>/i;</span><span class="line">        i = i + <span class="number">2</span>;</span><span class="line">    &#125;</span><span class="line">    <span class="keyword">return</span> sum;</span><span class="line">&#125;</span><span class="line"><span class="type">int</span> <span class="title function_">main</span><span class="params">()</span> &#123;</span><span class="line">    <span class="type">int</span> input = <span class="number">0</span>;</span><span class="line">    <span class="built_in">printf</span>(<span class="string">&quot;请输入一个数字:-&gt;&quot;</span>);</span><span class="line">    <span class="built_in">scanf</span>(<span class="string">&quot;%d&quot;</span>,&amp;input);</span><span class="line">    <span class="type">float</span> <span class="title function_">Odd</span><span class="params">(<span class="type">int</span> input)</span>;<span class="comment">//声明这两个函数</span></span><span class="line">    <span class="type">float</span> <span class="title function_">Even</span><span class="params">(<span class="type">int</span> input)</span>;</span><span class="line">    <span class="type">float</span> (*p)(<span class="type">int</span>);</span><span class="line">    <span class="keyword">if</span> (input % <span class="number">2</span> == <span class="number">0</span>)</span><span class="line">    &#123;</span><span class="line">        p = Odd;</span><span class="line">    &#125;</span><span class="line">    <span class="keyword">else</span></span><span class="line">    &#123;</span><span class="line">        p = Even;</span><span class="line">    &#125;</span><span class="line">    <span class="type">float</span> result = p(input);</span><span class="line">    <span class="built_in">printf</span>(<span class="string">&quot;%lf&quot;</span>,result);</span><span class="line">    <span class="keyword">return</span> <span class="number">0</span>;</span><span class="line">&#125;</span></pre></td></tr></table></figure></div><div class="post-tags"><a href="/tags/C/" class="post-tag"># C</a></div><nav class="post-nav"><a href="/posts/db978449.html" class="post-nav-prev" title="字符串排序">&larr; 字符串排序 </a><a href="/posts/3b13ca96.html" class="post-nav-next" title="翻转输出一个整数">翻转输出一个整数 &rarr;</a></nav></article></div></div></div></main><footer class="site-footer"><div class="footer-inner"><div class="footer-line"></div><div class="copyright">&copy; 2022 - 2026 <span>Zmyu&#39;s Blog</span></div></div></footer><div id="search-overlay" class="search-overlay"><div class="search-popup"><div class="search-header"><span class="search-icon">&#128269;</span> <input type="text" id="search-input" class="search-input" placeholder="输入关键字搜索..." autocomplete="off" autofocus> <span id="search-close" class="search-close">&times;</span></div><div id="search-results" class="search-results"></div></div></div><script src="/js/search.js?v=1.0.2"></script><script src="/js/main.js?v=1.0.2"></script><script src="/js/outdate.js"></script></body></html>
