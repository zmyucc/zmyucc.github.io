ity = TIM_ICPolarity_Rising;<span class="comment">//极性选择,代表不反向</span></span><span class="line">	TIM_ICInit(TIM3,&amp;TIM_ICInitStructure);</span><span class="line">	TIM_ICInitStructure.TIM_Channel = TIM_Channel_2;<span class="comment">//选择通道</span></span><span class="line">	TIM_ICInitStructure.TIM_ICFilter = <span class="number">0xF</span>;<span class="comment">//滤波器</span></span><span class="line">	TIM_ICInitStructure.TIM_ICPolarity = TIM_ICPolarity_Rising;<span class="comment">//极性选择,代表不反向</span></span><span class="line">	TIM_ICInit(TIM3,&amp;TIM_ICInitStructure);</span><span class="line">&nbsp;</span><span class="line">	TIM_EncoderInterfaceConfig(TIM3,TIM_EncoderMode_TI12,TIM_ICPolarity_Rising,TIM_ICPolarity_Rising);</span><span class="line">&nbsp;</span><span class="line">	TIM_Cmd(TIM3,ENABLE);</span><span class="line">&#125;</span><span class="line">&nbsp;</span><span class="line"><span class="type">int16_t</span> <span class="title function_">Encoder_Get</span><span class="params">(<span class="type">void</span>)</span></span><span class="line">&#123;</span><span class="line">	<span class="type">int16_t</span> Temp;</span><span class="line">	Temp = TIM_GetCounter(TIM3);</span><span class="line">	TIM_SetCounter(TIM3,<span class="number">0</span>);</span><span class="line">	<span class="keyword">return</span> Temp;</span><span class="line">&#125;</span><span class="line">&nbsp;</span><span class="line">&nbsp;</span></pre></td></tr></table></figure><p>main.c</p><figure class="highlight c"><table><tr><td class="gutter"><pre><span class="line">1</span><span class="line">2</span><span class="line">3</span><span class="line">4</span><span class="line">5</span><span class="line">6</span><span class="line">7</span><span class="line">8</span><span class="line">9</span><span class="line">10</span><span class="line">11</span><span class="line">12</span><span class="line">13</span><span class="line">14</span><span class="line">15</span><span class="line">16</span><span cla
