e">20</span><span class="line">21</span><span class="line">22</span><span class="line">23</span><span class="line">24</span><span class="line">25</span><span class="line">26</span><span class="line">27</span><span class="line">28</span><span class="line">29</span><span class="line">30</span><span class="line">31</span><span class="line">32</span><span class="line">33</span><span class="line">34</span><span class="line">35</span><span class="line">36</span><span class="line">37</span><span class="line">38</span><span class="line">39</span><span class="line">40</span><span class="line">41</span><span class="line">42</span><span class="line">43</span><span class="line">44</span><span class="line">45</span><span class="line">46</span><span class="line">47</span><span class="line">48</span><span class="line">49</span></pre></td><td class="code"><pre><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;stdio.h&gt;</span></span></span><span class="line"><span class="class"><span class="keyword">struct</span> <span class="title">Student</span>//先定义一个学生结构体</span></span><span class="line"><span class="class">&#123;</span></span><span class="line">    <span class="type">char</span> name[<span class="number">20</span>];</span><span class="line">    <span class="type">int</span> age;</span><span class="line">    <span class="type">char</span> sex[<span class="number">10</span>];</span><span class="line">    <span class="type">char</span> Phone[<span class="number">20</span>];</span><span class="line">&#125;;</span><span class="line"><span class="class"><span class="keyword">struct</span> <span class="title">Student</span> <span class="title">S</span>[1000];</span><span class="comment">//新建一个结构体数组</span></span><span class="line"><span class="type">int</span> count = <span class="number">0</span>;<span class="comment">//计数</span></span><span class="line"><span class="type">void</span> <span class="title function_">input</span><span class="params">()</span></span><span class="line">&#123;</span><span class="line">    <span class="class"><span class="keyword">struct</span> <span class="title">Student</span> <span class="title">S1</span>;</span></span><span class="line">    <span class="built_in">printf</span>(<span class="string">&quot;输入名字:-&gt;&quot;</span>);</span><span class="line">    <span class="built_in">scanf</span>(<span class="string">&quot;%s&quot;</span>,S1.name);</span><span class="line">    <span class="built_in">printf</span>(<span class="string">&quot;输入年龄:-&gt;&quot;</span>);</span><span class="line">    <span class="built_in">scanf</span>(<span class="string">&quot;%d&quot;</span>,&amp;S1.age);</span><span class="line">    <span class="built_in">printf</span>(<span class="string">&quot;输入性别:-&gt;&quot;</span>);</span><span class="line">    <span class="built_in">scanf</span>(<span class="string">&quot;%s&quot;</span>,S1.sex);</span><span class="line">    <span class="built_in">printf</span>(<span class="string">&quot;输入电话:-&gt;&quot;</span>);</span><span class="line">    <span class="built_in">scanf</span>(<span class="string">&quot;%s&quot;</span>,S1.Phone);</span><span class="line">    S[count] = S1;</span><span class="line">    count++;</span><span class="line">&#125;</span><span class="line"><span class="type">void</span> <span class="title function_">output</span><span class="params">()</span></span><span class="line">&#123;</span><span class="line">    <span class="type">int</span> i;</span><span class="line">    <span class="keyword">for</span> (i=<span class="number">0</span>; i&lt;count; i++)</span><span class="line">    &#123;</span><span class="line">        <span class="built_in">printf</span>(<span class="string">&quot;name:%s age:%d sex:%s phone:%s\n&quot;</span>,S[i].name,S[i].age,S[i].sex,S[i].Phone);</span><span class="line">    &#125;</span><span class="line">&#125;</span><span class="line"><span class="type">int</span> <span class="title function_">main</span><span class="params">()</span> &#123;</span><span class="line">    <span class="type">int</span> i = <span class="number">0</span>;</span><span class="line">    <span class="keyword">do</span> &#123;</span><span class="line">        <span class="built_in">printf</span>(<span class="string">&quot;1.输入数据 2.输出数据 0.退出:-&gt;&quot;</span>);</span><span class="line">        <span class="built_in">scanf</span>(<span class="string">&quot;%d&quot;</span>,&amp;i);</span><span class="line">        <span class="keyword">switch</span> (i) &#123;</span><span class="line">            <span class="keyword">case</span> <span class="number">1</span>:</span><span class="line">                input();</span><span class="line">                <span class="keyword">break</span>;</span><span class="line">            <span class="keyword">case</span> <span class="number">2</span>:</span><span class="line">                output();</span><span class="line">            <span class="keyword">default</span>:</span><span class="line">                <span class="keyword">break</span>;</span><span class="line">        &#125;</span><span class="line">    &#125; <span class="keyword">while</span> (i);</span><span class="line">    <span class="keyword">return</span> <span class="number">0</span>;</span><span class="line">&#125;</span></pre></td></tr></table></figure></div><div class="post-tags"><a href="/tags/C/" class="post-tag"># C</a></div><nav class="post-nav"><a href="/posts/3b13ca96.html" class="post-nav-prev" title="翻转输出一个整数">&larr; 翻转输出一个整数 </a><a href="/posts/1e1a9112.html" class="post-nav-next" title="写函数输出字符串长度">写函数输出字符串长度 &rarr;</a></nav></article></div></div></div></main><footer class="site-footer"><div class="footer-inner"><div class="footer-line"></div><div class="copyright">&copy; 2022 - 2026 <span>Zmyu&#39;s Blog</span></div></div></footer><div id="search-overlay" class="search-overlay"><div class="search-popup"><div class="search-header"><span class="search-icon">&#128269;</span>
