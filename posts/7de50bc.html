an class="line">19</span><span class="line">20</span><span class="line">21</span><span class="line">22</span><span class="line">23</span><span class="line">24</span><span class="line">25</span><span class="line">26</span><span class="line">27</span><span class="line">28</span><span class="line">29</span><span class="line">30</span><span class="line">31</span><span class="line">32</span><span class="line">33</span><span class="line">34</span><span class="line">35</span><span class="line">36</span><span class="line">37</span><span class="line">38</span><span class="line">39</span></pre></td><td class="code"><pre><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;stdio.h&gt;</span></span></span><span class="line"><span class="type">void</span> <span class="title function_">Insert</span><span class="params">(<span class="type">int</span>* arr, <span class="type">int</span> input)</span></span><span class="line">&#123;</span><span class="line">    <span class="type">int</span> i=<span class="number">0</span>;</span><span class="line">    <span class="keyword">if</span> (arr[<span class="number">8</span>]&gt;input) &#123;</span><span class="line">        <span class="keyword">for</span> (i=<span class="number">0</span>; i&lt;<span class="number">10</span>; i++)</span><span class="line">        &#123;</span><span class="line">            <span class="keyword">if</span> (arr[i]&gt;input)</span><span class="line">            &#123;</span><span class="line">                <span class="type">int</span> j;</span><span class="line">                <span class="keyword">for</span> (j=<span class="number">9</span>; j&gt;i; j--)</span><span class="line">                &#123;</span><span class="line">                    arr[j] = arr[j<span class="number">-1</span>];</span><span class="line">                &#125;</span><span class="line">                arr[i] = input;</span><span class="line">                <span class="keyword">break</span>;</span><span class="line">            &#125;</span><span class="line">        &#125;</span><span class="line">    &#125;</span><span class="line">    <span class="keyword">else</span></span><span class="line">    &#123;</span><span class="line">        arr[<span class="number">9</span>] = input;</span><span class="line">    &#125;</span><span class="line">&#125;</span><span class="line">&nbsp;</span><span class="line"><span class="type">int</span> <span class="title function_">main</span><span class="params">()</span></span><span class="line">&#123;</span><span class="line">    <span class="type">int</span> arr[<span class="number">10</span>] = &#123;<span class="number">111</span>,<span class="number">222</span>,<span class="number">333</span>,<span class="number">444</span>,<span class="number">555</span>,<span class="number">666</span>,<span class="number">777</span>,<span class="number">888</span>,<span class="number">999</span>&#125;;</span><span class="line">    <span class="type">int</span> input;</span><span class="line">    <span class="built_in">printf</span>(<span class="string">&quot;请输入要插入的数字:-&gt;&quot;</span>);</span><span class="line">    <span class="built_in">scanf</span>(<span class="string">&quot;%d&quot;</span>,&amp;input);</span><span class="line">    Insert(arr,input);</span><span class="line">    <span class="type">int</span> i;</span><span class="line">    <span class="keyword">for</span> (i=<span class="number">0</span>; i&lt;<span class="number">10</span>; i++)</span><span class="line">    &#123;</span><span class="line">        <span class="built_in">printf</span>(<span class="string">&quot;%d &quot;</span>,arr[i]);</span><span class="line">    &#125;</span><span class="line">    <span class="keyword">return</span> <span class="number">0</span>;</span><span class="line">&#125;</span></pre></td></tr></table></figure><hr><figure class="highlight c"><table><tr><td class="gutter"><pre><span class="line">1</span><span class="line" i&lt;ARR_LENGTH; i++)</span><span class="line">    &#123;</span><span class="line">        <span class="built_in">printf</span>(<span class="string">&quot;%d &quot;</span>,arr[i]);</span><span class="line">    &#125;</span><span class="line">    <span class="keyword">return</span> <span class="number">0</span>;</span><span class="line">&#125;</span></pre></td></tr></table></figure></div><div class="post-tags"><a href="/tags/C/" class="post-tag"># C</a></div><nav class="post-nav"><a href="/posts/38902a79.html" class="post-nav-prev" title="将一个数组逆序输出">&larr; 将一个数组逆序输出 </a><a href="/posts/c2c40989.html" class="post-nav-next" title="求矩阵对角线元素和">求矩阵对角线元素和 &rarr;</a></nav></article></div></div></div></main><footer class="site-footer"><div class="footer-inner"><div class="footer-line"></div><div class="copyright">&copy; 2022 - 2026 <span>Zmyu&#39;s Blog</span></div></div></footer><div id="search-overlay" class="search-overlay"><div class="search-popup"><div class="search-header"><span class="search-icon">&#128269;</span> <input type="text" id="search-input" class="search-input" placeholder="输入关键字搜索..." autocomplete="off" autofocus> <span id="search-close" class="search-close">&times;</span></div><div id="search-results" class="search-results"></div></div></div><script src="/js/search.js?v=1.0.0"></script><script>MathJax={tex:{inlineMath:[["$","$"],["\\(","\\)"]],displayMath:[["$$","$$"],["\\[","\\]"]],processEscapes:!0}}</script><script id="MathJax-script" async src="//cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script><script src="/js/main.js?v=1.0.0"></script><script src="/js/outdate.js"></script></body></html>
