ype">int</span> <span class="title function_">main</span><span class="params">()</span> &#123;</span><span class="line">    <span class="type">int</span> a;</span><span class="line">    <span class="type">int</span> c = <span class="number">1</span>;</span><span class="line">    <span class="type">int</span> b = <span class="number">123456</span>;</span><span class="line">    <span class="keyword">while</span> (c &lt;= <span class="number">3</span>) &#123;</span><span class="line">        <span class="built_in">printf</span>(<span class="string">&quot;请输入密码:-&gt;&quot;</span>);</span><span class="line">        <span class="built_in">scanf</span>(<span class="string">&quot;%d&quot;</span>,&amp;a);</span><span class="line">        <span class="keyword">if</span> (a == b) &#123;</span><span class="line">            <span class="built_in">printf</span>(<span class="string">&quot;登录成功&quot;</span>);</span><span class="line">            <span class="keyword">break</span>;</span><span class="line">        &#125;</span><span class="line">        <span class="keyword">else</span></span><span class="line">        &#123;</span><span class="line">            c++;</span><span class="line">        &#125;</span><span class="line">    &#125;</span><span class="line">    <span class="keyword">if</span> (c &gt; <span class="number">3</span>) &#123;</span><span class="line">        <span class="built_in">printf</span>(<span class="string">&quot;三次密码均错误&quot;</span>);</span><span class="line">    &#125;</span><span class="line">    <span class="keyword">return</span> <span class="number">0</span>;</span><span class="line">&#125;</span></pre></td></tr></table></figure></div><div class="post-tags"><a href="/tags/C/" class="post-tag"># C</a></div><nav class="post-nav"><a href="/posts/250ec2ff.html" class="post-nav-prev" title="分支和循环练习">&larr; 分支和循环练习 </a><a href="/posts/509865fe.html" class="post-nav-next" title="分支和循环练习-字符从两端向中间移动">分支和循环练习-字符从两端向中间移动 &rarr;</a></nav></article></div></div
