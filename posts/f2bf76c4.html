er class="site-header"><div class="header-inner"><div class="site-brand"><a href="/" class="site-title">Zmyu&#39;s Blog</a></div><nav class="site-nav"><ul class="nav-menu"><li class="nav-item"><a href="/">首页</a></li><li class="nav-item"><a href="/about/">关于</a></li><li class="nav-item"><a href="/tags/C/">C语言</a></li><li class="nav-item"><a href="/tags/PLC/">PLC</a></li><li class="nav-item"><a href="/tags/STM32/">STM32</a></li><li class="nav-item"><a href="/archives/">归档</a></li><li class="nav-item nav-item-search"><a href="javascript:void(0);" onclick="window.showPureSearch&&window.showPureSearch()" title="搜索" class="search-trigger"><svg class="search-icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></a></li></ul></nav></div></header><main class="main"><div class="main-inner"><div class="content-wrap"><div class="content"><article class="post-detail" itemscope itemtype="http://schema.org/Article"><header class="post-header"><h1 class="post-title" itemprop="name headline">3-5：itob(n,s,b)</h1><div class="post-meta"><span class="post-time">发表于 <time itemprop="datePublished" datetime="2024-12-02T14:30:00+08:00">2024-12-02</time></span></div></header><div class="post-body" itemprop="articleBody"><p>《C程序设计语言》练习3-5<br>编写函数itob(n,s,b)，将整数n转换为以b为底的数，并将转换结果以字符的形式保存到字符串s中，例如，itob(n,s,16)把整数n格式化为十六进制整数保存在s中。</p><p>代码：</p><figure class="highlight c"><table><tr><td class="gutter"><pre><span class="line">1</span><span class="line">2</span><span class="line">3</span><span class="line">4</span><span class="line">5</span><span class="line">6</span><span class="line">7</span><span class="line">8</span><span class="line">9</span><span class="line">10</span><span class="line">11</span><span class="line">12</span><span class="line">13</span><span class="line">14</span><span class="line">15</span><span class="line">16</span><span class="line">17</span><span class="line">18</span><span class="line">19</span><span class="line">20</span><span class="line">21</span><span class="line">22</span><span class="line">23</span><span class="line">24</span><span class="line">25</span><span class="line">26</span><span class="line">27</span><span class="line">28</span><span class="line">29</span><span class="line">30</span><span class="line">31</span><span class="line">32</span><span class="line">33</span><span class="line">34</span><span class="line">35</span><span class="line">36</span><span class="line">37</span><span class="line">38</span><span class="line">39</span><span class="line">40</span><span class="line">41</span></pre></td><td class="code"><pre><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;stdio.h&gt;</span></span></span><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;string.h&gt;</span></span></span><span class="line"><span class="type">void</span> <span class="title function_">itob</span><span class="params">(<span class="type">int</span> n,<span class="type">char</span> s[],<span class="type">int</span> b)</span>;</span><span class="line"><span class="type">void</span> <span class="title function_">Reverse</span><span class="params">(<span class="type">char</span> R[])</span>;</span><span class="line"><span class="type">int</span> <span class="title function_">main</span><span class="params">()</span> </span><span class="line">&#123;</span><span class="line">    <span class="type">int</span> n = <span class="number">3770</span>;</span><span class="line">    <span class="type">char</span> s[<span class="number">100</span>] = &#123;<span class="number">0</span>&#125;;</span><span class="line">    <span class="type">int</span> b = <span class="number">16</span>;</span><span class="line">    itob(n,s,b);</span><span class="line">    <span class="keyword">return</span> <span class="number">0</span>;</span><span class="line">&#125;</span><span class="line"><span class="type">void</span> <span class="title function_">itob</span><span class="params">(<span class="type">int</span> n,<span class="type">char</span> s[],<span class="type">int</span> b)</span></span><span class="line">&#123;</span><span class="line">    <span class="type">int</span> i = <span class="number">0</span>;</span><span class="line">    <span class="keyword">for</span> (i=<span class="number">0</span>; n != <span class="number">0</span>; i++)</span><span class="line">    &#123;</span><span class="line">        <span class="type">int</span> j = n % b;</span><span class="line">        <span class="keyword">if</span> (j&lt;<span class="number">10</span>)<span class="comment">//小于十进制的时候，用数字就够了</span></span><span class="line">        &#123;</span><span class="line">            s[i] = j+<span class="string">&#x27;0&#x27;</span>;</span><span class="line">            n = n / b;</span><span class="line">        &#125;</span><span class="line">        <span class="keyword">else</span> <span class="keyword">if</span> (j&lt;<span class="number">16</span>)<span class="comment">//适用于16进制时，还要用到字母</span></span><span class="line">        &#123;</span><span class="line">            s[i] = j+<span class="string">&#x27;a&#x27;</span><span class="number">-10</span>;</span><span class="line">            n = n / b;</span><span class="line">        &#125;</span><span class="line">    &#125;</span><span class="line">    Reverse(s);<span class="comment">//翻转字符串</span></span><span class="line">&#125;</span><span class="line"><span class="type">void</span> <span class="title function_">Reverse</span><span class="params">(<span class="type">char</span> R[])</span></span><span class="line">&#123;</span><span class="line">    <span class="type">int</span> c,i,j;</span><span class="line">    <span class="keyword">for</span> (i=<span class="number">0</span>,j=<span class="built_in">strlen</span>(R)<span class="number">-1</span>; i&lt;j; i++,j--)</span><span class="line">    &#123;</span><span class="line">        c = R[i];</span><span class="line">        R[i] = R[j];</span><span class="line">        R[j] = c;</span><span class="line">    &#125;</span><span class="line">&#125;</span></pre></td></tr></table></figure></div><div class="post-tags"><a href="/tags/C/" class="post-tag"># C</a> <a href="/tags/C%E7%A8%8B%E5%BA%8F%E8%AE%BE%E8%AE%A1%E8%AF%AD%E8%A8%80/" class="post-tag"># C程序设计语言</a></div><nav class="post-nav"><a href="/posts/bf204a4d.html" class="post-nav-prev" title="4-1：strrindex(s,t)">&larr; 4-1：strrindex(s,t) </a><a href="/posts/5cc1b76f.html" class="post-nav-next" title="3-3：expand(s1,s2)">3-3：expand(s1,s2) &rarr;</a></nav></article></div></div></div></main><footer class="site-footer"><div class="footer-inner"><div class="footer-line"></div><div class="copyright">&copy; 2022 - 2026 <span>Zmyu&#39;s Blog</span></div></div></footer><div id="search-overlay" class="search-overlay"><div class="search-popup"><div class="search-header"><span class="search-icon">&#128269;</span> <input type="text" id="search-input" class="search-input" placeholder="输入关键字搜索..." autocomplete="off" autofocus> <span id="search-close" class="search-close">&times;</span></div><div id="search-results" class="search-results"></div></div></div><script src="/js/search.js?v=1.0.2"></script><script src="/js/main.js?v=1.0.2"></script><script src="/js/outdate.js"></script></body></html>
