s="line">20</span><span class="line">21</span><span class="line">22</span><span class="line">23</span><span class="line">24</span><span class="line">25</span><span class="line">26</span><span class="line">27</span><span class="line">28</span><span class="line">29</span><span class="line">30</span><span class="line">31</span><span class="line">32</span></pre></td><td class="code"><pre><span class="line">&nbsp;</span><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;stdio.h&gt;</span></span></span><span class="line"><span class="type">int</span> <span class="title function_">Cal_Digit</span><span class="params">(<span class="type">int</span> input)</span></span><span class="line">&#123;</span><span class="line">    <span class="type">int</span> digit = <span class="number">0</span>;</span><span class="line">    <span class="keyword">while</span> (input&gt;<span class="number">0</span>)</span><span class="line">    &#123;</span><span class="line">        input = input / <span class="number">10</span>;<span class="comment">//每次除10，digit+1，直到input等于0为止</span></span><span class="line">        digit++;</span><span class="line">    &#125;</span><span class="line">    <span class="keyword">return</span> digit;</span><span class="line">&#125;  </span><span class="line"><span class="type">void</span> <span class="title function_">Reverse_Print</span><span class="params">(<span class="type">int</span> input,<span class="type">int</span> digit)</span></span><span class="line">&#123;</span><span class="line">    <span class="built_in">printf</span>(<span class="string">&quot;逆序后：&quot;</span>);</span><span class="line">    <span class="keyword">for</span> (; digit&gt;<span class="number">0</span>; digit--)</span><span class="line">    &#123;</span><span class="line">        <span class="type">int</span> Last_Nun = input%<span class="number">10</span>;<span class="comment">//找到最后一位数</span></span><span class="line">        <span class="built_in">printf</span>(<span class="string">&quot;%d&quot;</span>,Last_Nun);</span><span class="line">        input = input / <span class="number">10</span>;<span class="comment">//除以10，舍弃最后一位数，得到新的数</span></span><span class="line">    &#125;</span><span class="line">    <span class="built_in">printf</span>(<span class="string">&quot;\n&quot;</span>);</span><span class="line">&#125;</span><span class="line">&nbsp;</span><span class="line"><span class="type">int</span> <span class="title function_">main</span><span class="params">()</span> &#123;</span><span class="line">    <span class="type">int</span> input;</span><span class="line">    <span class="built_in">scanf</span>(<span class="string">&quot;%d&quot;</span>,&amp;input);</span><span class="line">    <span class="type">int</span> digit = Cal_Digit(input);<span class="comment">//计算数字的位数</span></span><span class="line">    <span class="built_in">printf</span>(<span class="string">&quot;这个数字是 %d 位数\n&quot;</span>,digit);</span><span class="line">    Reverse_Print(input,digit);<span class="comment">//逆序打印</span></span><span class="line">    <span class="keyword">return</span> <span class="number">0</span>;</span><span class="line">&#125;</span></pre></td></tr></table></figure></div><div class="post-tags"><a href="/tags/C/" class="post-tag"># C</a></div><nav class="post-nav"><a href="/posts/789745e4.html" class="post-nav-prev" title="判断回文数">&larr; 判断回文数 </a><a href="/posts/be527f81.html" class="post-nav-next" title="递归输出年龄">递归输出年龄 &rarr;</a></nav></article></div></div></div></main><footer class="site-footer"><div class="footer-inner"><div class="footer-line"></div><div class="copyright">&copy; 2022 - 2026 <span>Zmyu&#39;s Blog</span></div></div></footer><div id="search-overlay" class="search-overlay"><div class="search-popup"><div class="search-header"><span class="search-icon">&#128269;</span> <input type="text" id="search-input" class="search-input" placeholder="输入关键字搜索..." autocomplete="off" autofocus> <s
