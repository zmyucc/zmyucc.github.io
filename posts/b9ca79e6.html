ype="http://schema.org/WebPage"><header class="site-header"><div class="header-inner"><div class="site-brand"><a href="/" class="site-title">Zmyu&#39;s Blog</a></div><nav class="site-nav"><ul class="nav-menu"><li class="nav-item"><a href="/">首页</a></li><li class="nav-item"><a href="/about/">关于</a></li><li class="nav-item"><a href="/tags/C/">C语言</a></li><li class="nav-item"><a href="/tags/PLC/">PLC</a></li><li class="nav-item"><a href="/tags/STM32/">STM32</a></li><li class="nav-item"><a href="/archives/">归档</a></li><li class="nav-item nav-item-search"><a href="javascript:void(0);" onclick="window.showPureSearch&&window.showPureSearch()" title="搜索" class="search-trigger"><svg class="search-icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></a></li></ul></nav></div></header><main class="main"><div class="main-inner"><div class="content-wrap"><div class="content"><article class="post-detail" itemscope itemtype="http://schema.org/Article"><header class="post-header"><h1 class="post-title" itemprop="name headline">分支和循环练习-二分法-在有序数组中找到一个数</h1><div class="post-meta"><span class="post-time">发表于 <time itemprop="datePublished" datetime="2024-10-09T20:58:00+08:00">2024-10-09</time></span></div></header><div class="post-body" itemprop="articleBody"><p>在一个有序数组中查找某个具体数字n</p><figure class="highlight c"><table><tr><td class="gutter"><pre><span class="line">1</span><span class="line">2</span><span class="line">3</span><span class="line">4</span><span class="line">5</span><span class="line">6</span><span class="line">7</span><span class="line">8</span><span class="line">9</span><span class="line">10</span><span class="line">11</span><span class="line">12</span><span class="line">13</span><span class="line">14</span><span class="line">15</span><span class="line">16</span><span class="line">17</span><span class="line">18</span></pre></td><td class="code"><pre><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;stdio.h&gt;</span></span></span><span class="line"><span class="type">int</span> <span class="title function_">main</span><span class="params">()</span> &#123;</span><span class="line">    <span class="type">int</span> arr[]=&#123;<span class="number">1</span>,<span class="number">2</span>,<span class="number">3</span>,<span class="number">4</span>,<span class="number">5</span>,<span class="number">6</span>,<span class="number">7</span>,<span class="number">8</span>,<span class="number">9</span>,<span class="number">10</span>&#125;;</span><span class="line">    <span class="type">int</span> k = <span class="number">7</span>;</span><span class="line">    <span class="comment">//写代码，在数组中找到7</span></span><span class="line">    <span class="type">int</span> i = <span class="number">0</span>;</span><span class="line">    <span class="type">int</span> sz = <span class="keyword">sizeof</span>(arr)/<span class="keyword">sizeof</span>(arr[<span class="number">0</span>]);<span class="comment">//算出数组中元素个数</span></span><span class="line">    <span class="keyword">for</span> (i=<span class="number">0</span>; i&lt;sz; i++) &#123;</span><span class="line">        <span class="keyword">if</span> (k == arr[i]) &#123;</span><span class="line">            <span class="built_in">printf</span>(<span class="string">&quot;找到了，下标是:%d\n&quot;</span>,i);</span><span class="line">            <span class="keyword">break</span>;</span><span class="line">        &#125;</span><span class="line">    &#125;</span><span class="line">    <span class="keyword">if</span> (i == sz) &#123;</span><span class="line">        <span class="built_in">printf</span>(<span class="string">&quot;找不到&quot;</span>);</span><span class="line">    &#125;</span><span class="line">    <span class="keyword">return</span> <span class="number">0</span>;</span><span class="line">&#125;</span></pre></td></tr></table></figure><span id="more"></span><h3 id="使用二分法-在有序数组中找到一个数"><a href="#使用二分法-在有序数组中找到一个数" class="headerlink" title="使用二分法-在有序数组中找到一个数"></a>使用二分法-在有序数组中找到一个数</h3><p>使用二分法-查找效率高</p><figure class="highlight c"><table><tr><td class="gutter"><pre><span class="line">1</span><span class="line">2</span><span class="line">3</span><span class="line">4</span><span class="line">5</span><span class="line">6</span><span class="line">7</span><span class="line">8</span><span class="line">9</span><span class="line">10</span><span class="line">11</span><span class="line">12</span><span class="line">13</span><span class="line">14</span><span class="line">15</span><span class="line">16</span><span class="line">17</span><span class="line">18</span><span class="line">19</span><span class="line">20</span><span class="line">21</span><span class="line">22</span><span class="line">23</span><span class="line">24</span><span class="line">25</span><span class="line">26</span><span class="line">27</span></pre></td><td class="code"><pre><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;stdio.h&gt;</span></span></span><span class="line"><span class="type">int</span> <span class="title function_">main</span><span class="params">()</span> &#123;</span><span class="line">    <span class="type">int</span> arr[]=&#123;<span class="number">1</span>,<span class="number">2</span>,<span class="number">3</span>,<span class="number">4</span>,<span class="number">5</span>,<span class="number">6</span>,<span class="number">7</span>,<span class="number">8</span>,<span class="number">9</span>,<span class="number">10</span>&#125;;</span><span class="line">    <span class="type">int</span> k = <span class="number">11</span>; <span class="comment">//要查找的数字</span></span><span class="line">    <span class="type">int</span> sz = <span class="keyword">sizeof</span>(arr)/<span class="keyword">sizeof</span>(arr[<span class="number">0</span>]);<span class="comment">//算出数组中元素个数</span></span><span class="line">    <span class="type">int</span> left = <span class="number">0</span>;</span><span class="line">    <span class="type">int</span> right = sz - <span class="number">1</span>;<span class="comment">//右下标，就是元素个数减1</span></span><span class="line">    <span class="keyword">while</span> (left &lt;= right) &#123;</span><span class="line">        <span class="type">int</span> mid = (left + right) / <span class="number">2</span>;</span><span class="line">        <span class="keyword">if</span> (arr[mid] &gt; k) &#123;</span><span class="line">            right = mid - <span class="number">1</span>;</span><span class="line">        &#125;</span><span class="line">        <span class="keyword">else</span> <span class="keyword">if</span>(arr [mid] &lt; k)</span><span class="line">        &#123;</span><span class="line">            left = mid + <span class="number">1</span>;</span><span class="line">        &#125;</span><span class="line">        <span class="keyword">else</span></span><span class="line">        &#123;</span><span class="line">            <span class="built_in">printf</span>(<span class="string">&quot;找到了，下标是:%d\n&quot;</span>,mid);</span><span class="line">            <span class="keyword">break</span>;</span><span class="line">        &#125;</span><span class="line">    &#125;</span><span class="line">    <span class="keyword">if</span> (left &gt; right) &#123;</span><span class="line">        <span class="built_in">printf</span>(<span class="string">&quot;没找到&quot;</span>);</span><span class="line">    &#125;</span><span class="line">    <span class="keyword">return</span> <span class="number">0</span>;</span><span class="line">&#125;</span></pre></td></tr></table></figure></div><div class="post-tags"><a href="/tags/C/" class="post-tag"># C</a></div><nav class="post-nav"><a href="/posts/509865fe.html" class="post-nav-prev" title="分支和循环练习-字符从两端向中间移动">&larr; 分支和循环练习-字符从
